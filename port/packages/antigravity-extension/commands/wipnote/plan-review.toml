prompt = '''
# /wipnote:plan-review

Review a plan's slices with the user in the conversation and record a decision for each one.

## Usage

```
/wipnote:plan-review <plan-id>
```

## Parameters

- `plan-id` (required): The plan ID (e.g., `plan-3a88d8a9`)

## Instructions

1. Read the plan's slice cards from `.wipnote/plans/<plan-id>.yaml` (`wipnote plan show` prints only its metadata). If the file is missing, run `wipnote plan list` and ask which plan the user means.
2. For each slice not yet approved or rejected, show its title, complexity, effort and risk, `what`, `done_when`, its blocks, its `decisions_notes` and any open questions. Ask the user to approve, request changes, or reject, using the ask-user tool where there is one.
3. Record each answer as it comes:
   ```bash
   wipnote plan approve-slice <plan-id> <num>
   wipnote plan reject-slice <plan-id> <num>                      # reject
   wipnote plan reject-slice <plan-id> <num> --changes-requested  # request changes
   ```
   For a changes request, revise the slice from the user's comments, run `wipnote plan validate-yaml <plan-id>`, and ask about that slice again.
4. When every slice has a decision, summarise the approved and rejected slices and continue with Phase 5 of `/wipnote:plan` (decisions, then promotion), or run `wipnote plan finalize-yaml <plan-id>` if the user wants all approved slices promoted at once.

'''
