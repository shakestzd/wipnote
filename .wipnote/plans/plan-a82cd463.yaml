meta:
    id: plan-a82cd463
    track_id: trk-2e707ed1
    title: 'Delegate routing: subagent by default, session flags when a pane is worth it'
    description: Agents use wipnote delegate spawn for same-harness work that a native subagent does better. Add a routing rule, then make spawn worth choosing by passing session-level settings that subagents cannot set.
    created_at: "2026-10-31"
    status: draft
    priority: medium
    schema_version: v4
    version: 3
design:
    problem: |
        The agent prompt (cmd/wipnote/prompts/system-prompt.md, "Delegate when it
        helps") and the delegate skill (plugin/skills/delegate/SKILL.md, "the one way
        to hand work to another harness") give no rule for choosing between a native
        subagent and wipnote delegate spawn --harness claude. Agents then open a new
        Claude pane for work a subagent does with less cost and setup.
        A native subagent already sets tools, disallowedTools, model, effort,
        maxTurns, skills, memory, isolation, omitClaudeMd and, for non-plugin agents,
        mcpServers, hooks and permissionMode. A separate session is only worth it for
        settings a subagent cannot have: dropping inherited MCP servers
        (--strict-mcp-config), a permission mode other than the parent's
        auto/acceptEdits/bypass mode, a dollar budget, a fallback model, extra
        directories, its own setting sources, a different harness, a container, or a
        worker that the user steers in its own pane or that outlives this session.
        delegate spawn passes none of these: SpawnOptions.LaunchArgs
        (internal/delegate/session/spawn.go:51) is set only by the one-shot runner
        (internal/delegate/oneshot/claude_interactive.go:143), and BootArgv
        (internal/delegate/session/boot.go:49) already forwards Info.Args after "--".
    goals:
        - 'Routing: for same-harness work, agents use a native subagent unless the task needs a session-only setting from the list in the prompt.'
        - 'Spawn filters: delegate spawn takes flags for the tool set, MCP servers, model, effort, permission mode, budget, fallback model, extra directories and appended system prompt, and the worker starts with them.'
        - 'Profiles: a named profile in ~/.wipnote/config.json sets a group of these flags with one --profile name.'
    constraints:
        - Worker binding and the reply path must keep working. Flags that drop all hooks (--bare, --safe-mode) are refused, and a worker always keeps Bash for wipnote delegate reply.
        - Codex workers accept only the flags that have a Codex mapping; any other flag is refused with an error that names it.
        - The daemon and hooks never block or slow Claude (user rule).
    approved: false
    comment: ""
    research:
        - url: https://code.claude.com/docs/en/sub-agents
          claim: Subagent frontmatter supports tools, disallowedTools, model, effort, maxTurns, skills, memory, isolation, omitClaudeMd, mcpServers, hooks and permissionMode; plugin subagents ignore permissionMode, mcpServers and hooks; a parent in bypassPermissions, acceptEdits or auto forces that mode on every subagent; subagents inherit the parent's MCP tools.
          accessed: "2026-10-31"
        - url: https://code.claude.com/docs/en/cli-reference
          claim: 'Session flags checked against the installed claude 2.1.316 --help: --tools, --allowedTools, --disallowedTools, --mcp-config, --strict-mcp-config, --model, --effort, --permission-mode, --max-budget-usd, --fallback-model, --add-dir, --append-system-prompt, --setting-sources. The page itself was not re-read in this session (unverified against the web page).'
          accessed: "2026-10-31"
slices:
    - id: slice-1
      num: 1
      title: Routing rule for subagent or delegate
      what: |
        Add a rule to the agent prompt and the delegate skill: for the same harness,
        use a native subagent (Explore on Claude Code, explorer on Codex) unless the
        task needs a session-only setting, a user-steered pane, work that outlives
        this session, or a container. Make the redirect hook's deny text name the
        subagent option.
      why: |
        The prompt and skill call delegate "the one way" with no same-harness rule,
        and the redirect hook sends a bare claude -p to delegate run, which opens an
        interactive Claude pane inside herdr. Agents then pay for panes a subagent
        would not need.
      files:
        - cmd/wipnote/prompts/system-prompt.md
        - cmd/wipnote/system_prompt_delegate_test.go
        - plugin/skills/delegate/SKILL.md
        - plugin/skills/skills/SKILL.md
        - internal/delegate/detect/redirect.go
        - internal/delegate/detect/redirect_test.go
      deps: []
      done_when:
        - system-prompt.md states the rule in five lines or fewer, names Explore and explorer, and lists the session-only settings
        - the delegate skill opens with a subagent-or-delegate table, and the skills index lists spawn
        - a bare claude -p from a Claude caller is denied with text that offers a native subagent as well as delegate run
        - wipnote plugin build-ports leaves no diff after the change is committed
      effort: S
      risk: Low
      tests: |
        Unit (cmd/wipnote/system_prompt_delegate_test.go, existing): assert the rule
        and the session-only list. Unit (internal/delegate/detect/redirect_test.go):
        the deny text for claude -p names the subagent option.
      complexity: standard
      approved: false
      comment: ""
      research:
        - url: https://code.claude.com/docs/en/sub-agents
          claim: The session-only list comes from what subagent frontmatter cannot set, and from the plugin-subagent and parent-mode limits.
          accessed: "2026-10-31"
      critic_revisions:
        - source: local-feasibility
          severity: MEDIUM
          summary: 'AMENDED: added the redirect hook (redirect.go:71-75), which steers bare claude -p into an interactive pane; system-prompt.md is also Codex''s developer_instructions (codex_launch.go:337-349), so the rule names Explore and explorer; dropped yolo-prompt.md, which has no delegate section; added the skills index (skills/SKILL.md:24).'
      decisions_notes: |
        **Rule:** default to a native subagent for same-harness work; delegate for
        another harness, a container, a session-only setting, a user-steered pane, or
        work that outlives this session.
        **Sequencing:** slice 5 of plan-5ffde4d2 also edits system-prompt.md; run
        them one after the other.
        **Rejected:** a hook that denies delegate spawn --harness claude. Some panes
        are worth it, and the deny would need the same judgment the rule gives.
      blocks:
        - type: file-tree
          title: Files touched
          entries:
            - cmd/wipnote/prompts/system-prompt.md
            - cmd/wipnote/system_prompt_delegate_test.go
            - plugin/skills/delegate/SKILL.md
            - plugin/skills/skills/SKILL.md
            - internal/delegate/detect/redirect.go
            - internal/delegate/detect/redirect_test.go
    - id: slice-2
      num: 2
      title: Session flags on delegate spawn
      what: |
        Add spawn flags --tools, --disallowed-tools, --mcp-config, --inherit-mcp,
        --model, --effort, --permission-mode, --add-dir and
        --append-system-prompt-file. Strict MCP is the default. Reuse the flag helpers
        in oneshot/claude_plan.go, store the flags in their own Info field, and
        re-apply them on resume.
      why: |
        These settings make a separate session worth more than a subagent. Today
        spawn starts a full session with every tool and every MCP server loaded.
      files:
        - cmd/wipnote/delegate_spawn.go
        - cmd/wipnote/delegate_spawn_test.go
        - internal/delegate/oneshot/claude_plan.go
        - internal/delegate/session/launchflags.go
        - internal/delegate/session/launchflags_test.go
        - internal/delegate/session/info.go
        - internal/delegate/session/spawn.go
        - internal/delegate/session/resume.go
        - cmd/wipnote/claude.go
      deps: []
      done_when:
        - spawn --tools Read,Grep,Bash --model sonnet boots claude with those flags, --strict-mcp-config and an allowed rule for Bash(wipnote delegate reply:*)
        - a tool set or deny list that removes Bash, and --bare or --safe-mode, are refused with the reason
        - spawn --append-system-prompt-file adds to wipnote's prompt and does not replace it
        - spawn --resume restores the stored flags and never the one-shot --session-id
        - with --container, a host-path flag is refused; a Codex flag with no mapping is refused by name
      effort: L
      risk: Med
      tests: |
        Unit (internal/delegate/session/launchflags_test.go): TestLaunchFlags_ClaudeArgv,
        TestLaunchFlags_KeepsReplyPath, TestLaunchFlags_StrictMCPDefault,
        TestLaunchFlags_ContainerRefusesHostPaths. Unit (cmd/wipnote/delegate_spawn_test.go):
        TestSpawn_FlagsReachBootArgv, TestSpawn_ResumeKeepsFlags. Live check: confirm
        whether --strict-mcp-config also drops plugin MCP servers, and record it.
      complexity: standard
      approved: false
      comment: ""
      research:
        - url: https://code.claude.com/docs/en/cli-reference
          claim: Flag names checked against the installed claude 2.1.316 --help; --max-budget-usd and --fallback-model are print-mode only, so they are left out of interactive spawn.
          accessed: "2026-10-31"
        - url: https://learn.chatgpt.com/docs/config-file/config-reference
          claim: Codex model and reasoning effort map to --model and -c model_reasoning_effort; verify on this page before implementation (unverified).
          accessed: "2026-10-31"
      questions:
        - id: q-mcp-default
          text: Should a spawned worker drop the caller's MCP servers by default (--strict-mcp on unless --mcp-config or --inherit-mcp is given)? It saves context, but a worker that needs an MCP tool would fail until the caller adds it.
          answer: 'yes: a spawned worker loads only the MCP servers the delegated task needs. --strict-mcp is on by default; the caller names needed servers with --mcp-config (or a preset does); --inherit-mcp restores the caller''s full set.'
      critic_revisions:
        - source: local-feasibility
          severity: HIGH
          summary: 'AMENDED: --tools without Bash broke the reply path (boot.go:85-104), so Bash is kept and the reply command is allowed; --max-budget-usd and --fallback-model are print-only (claude_plan.go:44-48), dropped; --settings and --plugin-dir do not break binding (claude_interactive.go:159-172), so only --bare and --safe-mode are refused; the launcher already adds --append-system-prompt-file (claude.go:401), so the spawn file is merged; resume never copied Info.Args (resume.go:55-62), so flags get their own field; container boots reuse Args (containerboot.go:127), so host-path flags are refused there; reuse the oneshot flag helpers.'
      decisions_notes: |
        **Plumbing:** SpawnOptions.LaunchArgs and BootArgv, which puts launch args
        after the brief so variadic flags cannot swallow the prompt.
        **Reuse:** move claudeValueFlags, claudeVariadicFlags, flagValues and
        absPaths out of oneshot/claude_plan.go into session/launchflags.go; absPaths
        matters because claude runs in --work-dir.
        **Safety:** an allowlist of flags, not a raw passthrough.
        **Left out:** a dollar budget for interactive workers needs a wipnote watcher
        like claude_watch.go:179; that is a follow-up, not this slice.
      blocks:
        - type: file-tree
          title: Files touched
          entries:
            - cmd/wipnote/delegate_spawn.go
            - cmd/wipnote/delegate_spawn_test.go
            - internal/delegate/oneshot/claude_plan.go
            - internal/delegate/session/launchflags.go
            - internal/delegate/session/launchflags_test.go
            - internal/delegate/session/info.go
            - internal/delegate/session/spawn.go
            - internal/delegate/session/resume.go
            - cmd/wipnote/claude.go
    - id: slice-3
      num: 3
      title: Named worker presets
      what: |
        Read delegate.workers.<name> from the user config layer with
        paths.ReadLayeredConfig, as oneshot/settings.go does. Each preset holds slice
        2 flag values. Add --preset <name> to delegate spawn; explicit flags override
        it. A preset in the project layer is ignored with a warning. Document two
        examples in the delegate skill.
      why: |
        A reviewer or researcher worker needs the same five flags every time. A
        preset makes the right setup one word, so agents use it.
      files:
        - internal/delegate/session/presets.go
        - internal/delegate/session/presets_test.go
        - cmd/wipnote/delegate_spawn.go
        - plugin/skills/delegate/SKILL.md
      deps:
        - 2
      done_when:
        - delegate spawn --preset reviewer starts the worker with the preset's flags
        - an explicit flag on the command line overrides the same field in the preset
        - an unknown preset name fails with the list of defined presets
        - a preset found only in the project config layer is ignored with a warning
      effort: S
      risk: Low
      tests: |
        Unit (internal/delegate/session/presets_test.go): TestPresets_Load,
        TestPresets_FlagOverrides, TestPresets_UnknownNameListsDefined,
        TestPresets_ProjectLayerIgnored.
      complexity: standard
      approved: false
      comment: ""
      research_waiver: Reads wipnote's own layered config; the flag set comes from slice 2.
      critic_revisions:
        - source: local-feasibility
          severity: MEDIUM
          summary: 'AMENDED: reuse paths.ReadLayeredConfig (core/paths/layered_config.go:52), not the one-off codex.LoadOptIn; renamed profile to preset and delegate.workers, because delegate already has leanProfile (a Codex -p profile) and Codex has its own --profile; limited to spawn, because delegate run takes a raw tool argv (delegate_run.go:86).'
      decisions_notes: |
        **Config:** delegate.workers.<name> in the user layer of the layered config.
        **Rejected:** presets in the project layer. That adds files to the project,
        which plan-5ffde4d2 tries to avoid. **Rejected:** --preset on delegate run;
        it would rewrite a tool argv the caller wrote.
      blocks:
        - type: file-tree
          title: Files touched
          entries:
            - internal/delegate/session/presets.go
            - internal/delegate/session/presets_test.go
            - cmd/wipnote/delegate_spawn.go
            - plugin/skills/delegate/SKILL.md
questions: []
