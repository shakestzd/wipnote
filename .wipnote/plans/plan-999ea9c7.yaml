meta:
    id: plan-999ea9c7
    track_id: trk-2505b527
    title: 'Git workflow monitoring: native CI, review, branch, base and release watch'
    description: Make what the ci-live mod does native to wipnote, plus review state, branch health, base-branch CI and releases. A read-only Go layer (internal/gitwatch) shells out to gh and git (gh keeps auth; wipnote holds no token), a 'wipnote ci status --json' and 'wipnote ci watch' CLI usable from every harness, a thin Claude Code pane mod (mods/wipnote-ci), and links from PR state to work items. Ports MIT code from cli/cli, git-town, lazygit and gh-poi with notices; writes the rest fresh.
    created_at: "2026-10-26"
    status: draft
    priority: medium
    schema_version: v4
    version: 9
design:
    problem: ""
    goals: []
    constraints: []
    approved: false
    comment: ""
slices:
    - id: slic-6a75ace9
      num: 1
      title: 'gitwatch core: runner, PR checks snapshot, work-item link'
      what: 'New internal/gitwatch package. A Runner interface over os/exec (fakeable in tests) that runs gh/git with a timeout and reads stdout JSON whatever the exit code (gh exits 8 pending, 1 failed). Checks: gh pr checks <n> --json name,state,bucket,startedAt,completedAt,link,workflow,isRequired... Port cli/cli aggregateChecks + eliminateDuplicates (MIT, notice in THIRD-PARTY-NOTICES.md) and add STARTUP_FAILURE to fail. PR lookup as ci-live: number, branch, current branch, newest own open PR. Work-item id from branch name then PR title via one shared regex (reuse bareWorkItemRe shape). ''wipnote ci status [pr|branch] --json'' and a short text form under the existing ci command group.'
      why: One read layer every harness can call; the mod and gate only render it.
      files:
        - internal/gitwatch/runner.go
        - internal/gitwatch/checks.go
        - internal/gitwatch/pr.go
        - internal/gitwatch/workitem.go
        - cmd/wipnote/ci_status.go
        - THIRD-PARTY-NOTICES.md
      deps: []
      done_when:
        - ci status --json prints checks with buckets and counts
        - pending and failed gh exits still parse
        - duplicate re-runs collapse to latest
        - STARTUP_FAILURE counts as failed
        - work item id found from branch or title
        - no gh or not signed in reports a clear not-available state and exit 0
      effort: M
      risk: Low
      tests: 'Unit with fake Runner and recorded gh JSON fixtures: bucket mapping table incl STARTUP_FAILURE (red first), dedupe keeps latest, exit 8/1 with valid stdout parses, invalid stdout errors with first stderr line, id extraction positive and negative cases'
      approved: false
      comment: ""
    - id: slic-d786b3ca
      num: 2
      title: 'Review state: decision, threads, requested reviewers, mergeability'
      what: 'Add to gitwatch: gh pr view --json reviewDecision,reviewRequests,latestReviews,mergeable,mergeStateStatus,state,title,headRefName,baseRefName,baseRefOid,url, plus one gh api graphql call for reviewThreads(first:100){isResolved,isOutdated} (shape from gh-dash prapi.go). mergeable UNKNOWN is reported as computing, never as a conflict.'
      why: 'CI green is not mergeable: threads, conflicts and missing approval block too.'
      files:
        - internal/gitwatch/review.go
        - internal/gitwatch/review_test.go
      deps:
        - 1
      done_when:
        - status shows decision
        - unresolved and outdated thread counts
        - requested reviewers
        - merge state
        - UNKNOWN mergeable shows computing
      effort: S
      risk: Low
      tests: Fixtures for APPROVED, CHANGES_REQUESTED, conflicts (DIRTY), BEHIND, UNKNOWN; thread counting excludes resolved
      approved: false
      comment: ""
    - id: slic-39943c21
      num: 3
      title: 'Branch health: ahead/behind, dirty, unpushed, stale worktrees'
      what: 'Local git only. One NUL-separated for-each-ref call (port git-town format + determineSyncStatus; lazygit ahead-behind parser, falling back to rev-list --left-right --count on git <2.41). git status --porcelain=v2 --branch for dirty and unpushed. Worktrees from git worktree list --porcelain (port gh-poi parseWorktrees). Stale when ANY of: branch merged into base incl squash (gh-poi isFullyMerged), upstream gone, idle N days (setting, default 7, via layered config), PR closed unmerged. Reports only; never removes a worktree. Replace context_pack gitAheadBehind with the shared code.'
      why: Most lost work in this repo is a stale worktree or an unpushed branch.
      files:
        - internal/gitwatch/branch.go
        - internal/gitwatch/worktrees.go
        - cmd/wipnote/context_pack.go
        - THIRD-PARTY-NOTICES.md
      deps:
        - 1
      done_when:
        - status shows ahead/behind base
        - dirty and unpushed counts
        - worktree list marks each stale reason
        - idle days read from config
        - nothing is deleted
      effort: M
      risk: Med
      tests: 'Temp git repos (no real project): ahead/behind, dirty, unpushed, merged, squash-merged, upstream gone, idle via faked commit dates; old-git fallback path'
      approved: false
      comment: ""
    - id: slic-d7d68ace
      num: 4
      title: Base branch CI and releases
      what: 'Base = PR baseRefName, else plan base_branch, else main. gh run list --branch <base> --limit N --json headSha,status,conclusion,workflowName,url,createdAt; mark ''base red too'' when the PR''s base commit or latest base run failed. Releases: gh release view --json tagName,publishedAt, git rev-list --count <tag>..origin/<base>, latest runs of the release workflow (name a setting; default: workflow whose file matches release).'
      why: Tell a PR's own failure from a broken base; see unreleased work at a glance.
      files:
        - internal/gitwatch/base.go
        - internal/gitwatch/release.go
      deps:
        - 1
      done_when:
        - status shows base CI state and base-red-too flag
        - latest release tag and commits since
        - release workflow last run
        - no releases reported as none not error
      effort: S
      risk: Low
      tests: 'Fixtures: base green, base red, no runs; release present, absent; commit count from temp repo'
      approved: false
      comment: ""
    - id: slic-c42f5f06
      num: 5
      title: 'wipnote ci watch: bounded poll loop'
      what: 'Foreground loop, no daemon: checks every 15s while any are pending, review/base/release every 60s, back off to 60s when nothing runs, stop when settled (no pending checks or PR merged/closed) or --timeout. --json-lines emits one snapshot per change; text mode redraws a summary. Exit code: 0 all passed, 1 any failed, 2 timeout, 3 not available.'
      why: One watcher for the pane, Codex/Antigravity shells and scripts; orch-style durable settle.
      files:
        - internal/gitwatch/watch.go
        - cmd/wipnote/ci_watch.go
      deps:
        - 1
        - 2
        - 3
        - 4
      done_when:
        - watch stops on settle and on timeout with documented exit codes
        - review state polled at the slower rate
        - never runs from a hook
      effort: S
      risk: Low
      tests: 'Fake clock and runner: cadence per field, backoff, settle on merged, timeout exit 2, json-lines only on change'
      approved: false
      comment: ""
    - id: slic-e9bbd921
      num: 6
      title: mods/wipnote-ci pane over the CLI
      what: 'Thin Claude Code mod, modeled on ci-live (format, sort fail first, icons, elapsed time, toast on finish, status-line summary): /ci, /ci 85, /ci <branch>, /ci stop. It runs ''wipnote ci status --json'' on the cadence from slice 5 (or reads watch --json-lines) and renders sections: checks, review, branch, base, release, linked work item. No gh calls in TypeScript. Loaded by the existing mods folder; README and prompt.md.'
      why: Keep the live pane the owner liked, with logic in Go shared by every harness.
      files:
        - mods/wipnote-ci/hooks/register.tsx
        - mods/wipnote-ci/hooks/format.ts
        - mods/wipnote-ci/types/index.d.ts
        - mods/wipnote-ci/.claude-plugin/plugin.json
        - mods/wipnote-ci/README.md
        - mods/wipnote-ci/tests/pane.test.tsx
      deps:
        - 5
      done_when:
        - /ci opens the pane and follows the PR
        - /ci stop ends polling
        - pane shows all five sections and the work item
        - mod tests pass
      effort: M
      risk: Low
      tests: Port ci-live register.test; render tests from JSON fixtures; stop clears timers
      approved: false
      comment: ""
    - id: slic-6aaa0733
      num: 7
      title: Work-item links and gate warning
      what: wipnote check --gate --work-item <id> finds the PR whose branch or title names the id and adds a WARN (not a fail) line when its CI is red, it has a conflict, or unresolved threads; skipped silently when gh is unavailable. 'wipnote ci status --work-item <id>' resolves the PR from the id. Feature show prints the linked PR and its CI state.
      why: Plans and work items are the durable layer; PR state should show where the work is tracked.
      files:
        - cmd/wipnote/check.go
        - internal/gitwatch/link.go
      deps:
        - 1
        - 2
      done_when:
        - gate warns on red
        - conflicted or threaded PR and stays exit 0
        - no gh means no line and no delay beyond the runner timeout
        - ci status --work-item resolves the PR
      effort: S
      risk: Med
      tests: Gate test with fake runner for red, green, conflict, no gh; two-sided
      approved: false
      comment: ""
