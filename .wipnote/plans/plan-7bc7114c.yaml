      files:
        - cmd/wipnote/workitem.go
        - cmd/wipnote/workitem_provenance_canonical.go
        - cmd/wipnote/statusline.go
        - internal/blame/areas.go
        - internal/blame/blame.go
        - core/hooks/session_html.go
        - core/hooks/missing_events.go
        - core/hooks/transcript_user_prompt.go
      deps: []
      done_when:
        - Timings before and after are recorded for complete and statusline and code-areas
        - Full test suite passes
      effort: L
      risk: Med
      tests: |-
        cmd/wipnote: TestFeatureComplete_LinkedCommitsComputedOnce — count canonicalLinkedCommits calls (seam) on the complete path; expect 1.
        internal/blame: TestWalkAreas_SingleQuery — results equal the old per-file output on a fixture; one query issued.
        core/hooks: TestAppendEventToSessionHTML_TailAppend — output equals the old rewrite byte for byte on a fixture; file is not truncated.
        core/hooks: TestStop_BackfillReadsFromOffset — second Stop reads only bytes after the saved offset.
        Timings before and after for feature complete, statusline (with an open claim) and code-areas recorded in the work item.
      approved: false
      comment: ""
      research_waiver: Internal performance work on wipnote's own git, SQLite projection and HTML paths; no external library or standard applies. Baselines are the measured timings in decisions_notes.
      decisions_notes: |-
        **Evidence (43ab0cbd9):** canonicalLinkedCommits (workitem_provenance_canonical.go:88) runs at workitem.go:332 (dirty only), :347, :357 (remote only), :369 and :476: 4-5 runs, 1.6 s each under load. WalkAreas: one LIKE '%/...' query per tracked file (areas.go:158, blame.go:134) on an in-memory projection hydrated each run. AppendEventToSessionHTML (session_html.go:241-323) flocks, reads, truncates and rewrites a 255 KB file on every posttooluse-record. Stop now uses last_assistant_message, but backfillMissedUserPrompts (missing_events.go:183, transcript_user_prompt.go:118-140) still decodes the whole transcript each time.
        **Changed since the audit:** statusline with no --session returns at once (0.15-0.49 s, mostly init); only the open-claim branch (projection.Load at :157) is slow, and it needs a timing before any change.
