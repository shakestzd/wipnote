meta:
    id: plan-7bc7114c
    track_id: trk-0677c709
    title: Cut bloat and speed up wipnote
    description: 'Fixes from the spk-f72d2045 audit (five read-only audits on 2026-10-25): about 10,000 lines of dead code from the removed dashboard, serve and SQLite eras; hot-path costs on every hook call; duplicated helpers; stale model ids and unused harness features; and the correctness bugs the audit found on the way.'
    created_at: "2026-10-25"
    status: draft
    priority: medium
    schema_version: v4
    version: 13
design:
    problem: 'Five read-only audits (spk-f72d2045, 2026-10-25) found about 10,000 lines of code left over from the removed dashboard, serve and SQLite eras, hot-path cost on every hook call, helpers copied up to ten times with drift, stale model ids and unused harness features. On the way they found correctness bugs that give wrong answers today: claims reconcile closes live sessions, every YOLO commit is blocked, claim release and heartbeat persist nothing. A re-check on v0.82.1 (87bc16d0d) confirmed 7 of 8 bugs are still present.'
    goals:
        - Fix every confirmed correctness bug with a test that failed before the fix.
        - Delete code with no production caller, measured by deadcode/unused tools, not by reading.
        - Cut per-hook and slow CLI path cost with timings recorded before and after.
        - Leave one copy of each shared helper and no file or function over the repo limits in touched code.
    constraints:
        - Bugs are fixed before the code around them is deleted, so the evidence survives.
        - The canonical store (.wipnote HTML, ledgers, NDJSON, git) stays the source of truth; no slice adds a persistent SQLite file.
        - Daemons and hooks never block Claude (user rule).
        - Slice 6 coordinates with in-progress feat-fc3cc9e0 and does not redo its work.
        - Each slice runs as its own work item from wt-cleanup and passes the full suite before merge.
    approved: false
    comment: ""
    research:
        - url: https://pkg.go.dev/golang.org/x/tools/cmd/deadcode
          claim: deadcode reports functions unreachable from main via whole-program RTA analysis; used to verify dead code in slices 3-5 instead of grep alone.
          accessed: "2026-10-25"
slices:
    - id: slic-cf011c90
      num: 1
      title: Fix the correctness bugs the audit found
      what: 'Reproduce and fix seven confirmed bugs: claims reconcile/archive close live sessions (bug-01f182e5); YOLO commit guard always blocks; claim release/heartbeat persist nothing; core maps spc- where ids are spec-; relevant parses an unused trailer; launchYoloDev skips enforceLaunchPlan; unlocked session HTML and compliance lock writes.'
      why: These give wrong answers today. Deleting code around them first would hide the evidence.
      files:
        - cmd/wipnote/claim_ledger.go
        - cmd/wipnote/claims.go
        - cmd/wipnote/claim.go
        - core/hooks/yolo_guard.go
        - core/hooks/pretooluse.go
        - core/workitem/htmlwriter.go
        - core/workitem/resolve.go
        - cmd/wipnote/relevant.go
        - cmd/wipnote/yolo.go
        - core/hooks/session_html.go
        - cmd/wipnote/compliance_auto.go
      deps: []
      done_when:
        - Each bug is reproduced by a failing test before its fix
        - Each claim the audit made but could not reproduce is recorded as not a bug
        - go build/vet/test pass
      effort: M
      risk: Med
      tests: |-
        cmd/wipnote: TestClaimsReconcile_KeepsLiveForeignSession — open episode for root S, S open in sessions ledger, other current session; reconcile keeps it open.
        core/hooks: TestPreToolUse_YoloCommitAllowedAfterCanonicalTestRun — go test and git diff events in tool-events.ndjson, ephemeral DB, yolo on; git commit is not blocked.
        cmd/wipnote: TestClaimRelease_PersistsToLedger — release then claimledger ReadAll shows the episode closed (same for heartbeat).
        core/workitem: TestCollectionDirForID_Spec — GenerateID("spec") maps to specs and kindFromPrefix returns spec.
        cmd/wipnote: TestExtractCommitItems_RefsAndInlineID — Refs: trailer and inline (bug-x) both attributed.
        cmd/wipnote: TestLaunchYoloDev_RefusesOnDirtyProtectedBranch — WIPNOTE_ENFORCE_ISOLATION=true, dirty main; refused before exec.
        core/hooks: TestSessionHTML_ConcurrentAppendAndSetActiveFeature — N appenders plus SetSessionHTMLActiveFeature, -count=50; attribute and N entries survive.
        cmd/wipnote: TestAcquireComplianceLock_Exclusive — 20 subprocesses behind a barrier; exactly one acquires.
      approved: false
      comment: ""
      research_waiver: Internal correctness fixes against wipnote's own ledgers and lock helpers; no external library or standard applies. Evidence is the file:line re-check recorded in decisions_notes.
      decisions_notes: |-
        **Evidence:** re-check on v0.82.1 (43ab0cbd9): claim_ledger.go:211 uses SessionLivenessByHeartbeat over ledger rows projected with a 1970 heartbeat (claim_repo.go:686); yolo_guard.go:1431-1497 query agent_events on the empty ephemeral projection (dbgate.go:193), so pretooluse.go:279-285 blocks every YOLO commit; claim.go:216/:316 write to openDB's discarded projection; htmlwriter.go:456 and resolve.go:32 test spc- while ids are spec- (link.go is correct); relevant.go:610 parses wipnote-item: (0 commits) instead of parseTrailers Refs:/Fixes:; yolo.go:477 never calls enforceLaunchPlan; session_html.go:200/:229 write without flock; compliance_auto.go:481-502 read-then-write lock.
        **Decisions:** liveness uses the sessions-ledger EndedAt rule already in liveForeignClaims; YOLO evidence reads canonical tool-events.ndjson; claim release/heartbeat write claimledger (or are deleted if no caller needs them, decided in the work item); locks use core/filelock.
        **Rejected:** fixing link.go to spc- — ids are generated as spec-, so core is wrong.
      blocks:
        - type: tabs
          title: Bugs and their tests
          rows:
            - body: 'reconcile/archive: heartbeat 1970 marks live sessions dead. release/heartbeat: write to a discarded projection. Fix: sessions-ledger EndedAt, claimledger writes.'
              label: Claims
            - body: 'hasRecentTestRun/hasRecentDiffReview read the empty projection, so every YOLO git commit is blocked. Fix: read tool-events.ndjson. launchYoloDev: call enforceLaunchPlan.'
              label: YOLO
            - body: 'core tests spc- but ids are spec-. relevant parses wipnote-item: (0 commits). Fix: spec- in core, reuse parseTrailers.'
              label: IDs and trailers
            - body: 'SetSessionHTMLActiveFeature and CreateSessionHTML skip the flock the appender uses. Compliance lock is read-then-write. Fix: core/filelock.'
              label: Locks
