    - id: slic-a896a337
      num: 6
      title: Cut per-hook cost
      what: 'Finish the hook part of feat-fc3cc9e0: no hook opens the file-backed SQLite db, and guards stop querying the empty in-memory projection. Also gate debug.log on WIPNOTE_DEBUG, build plan and recap templates lazily, and test whether PostToolBatch or a daemon http hook can replace the second per-tool process.'
      why: Every tool call and prompt pays these costs; measured examples are 30 ms init, 2-3 ms projection, 2 git spawns and up to 512 KB of JSON per YOLO call.
      files:
        - core/hooks/dbgate.go
        - core/hooks/tooluse_shared.go
        - core/hooks/pretooluse.go
        - core/hooks/yolo_guard.go
        - core/hooks/log.go
        - cmd/wipnote/hook.go
        - plan/plantmpl
        - plan/blocks
        - recap/recaptmpl
        - packages/plugin-core/manifest.json
      deps:
        - 4
      done_when:
        - A benchmark shows the pretooluse handler time before and after
        - No hook opens a file-backed SQLite database
        - Hook behaviour tests pass
      effort: L
      risk: Med
      tests: |-
        core/hooks: TestHooks_NoFileBackedDB — run each hook subcommand with HOME and cache dirs in t.TempDir; assert no wipnote.db file is created.
        core/hooks: guard tests read canonical NDJSON/HTML evidence (hasRecentResearch, recent test run) and return true when the evidence exists.
        core/hooks: TestDebugLog_OffByDefault — no debug.log write unless WIPNOTE_DEBUG=1.
        plan/plantmpl, recap/recaptmpl: BenchmarkInit or an inittrace check shows no template parse at package init.
        Benchmark: pretooluse handler time before and after, recorded in the work item.
      approved: false
      comment: ""
      research:
        - url: https://code.claude.com/docs/en/hooks
          claim: Source for hook event list, PostToolBatch and http hook type; the spike step checks whether one batched or http hook can replace the per-tool PostToolUse process.
          accessed: "2026-10-25"
        - url: https://pkg.go.dev/runtime#hdr-Environment_Variables
          claim: GODEBUG=inittrace=1 prints per-package init time and allocations; used to measure template init cost before and after.
          accessed: "2026-10-25"
      decisions_notes: |-
        **Evidence (43ab0cbd9):** OpenHookDB and OpenHookDBWithBusyTimeout (dbgate.go:148/:233) open storage.CanonicalDBPath with migrations for every hookSubcmd hook, including stop (hook.go:237), session start/end/resume (:355, :379-383), track-event (:410) and daemon-miss fallbacks (dbgate.go:462/:567); a 3.5 MB wipnote.db was written today. The dbgate.go:161 comment says stop is read-only; it is not. Guards query the empty projection at tooluse_shared.go:125-396, pretooluse.go:352-1016 and yolo_guard.go:346-1660 and always get zero rows (bug-369da005 failure mode). Init: plantmpl 8-42 ms, blocks 2.5-13 ms, recaptmpl 0.35-13 ms; total init 58-174 ms on a loaded box. debugLog (log.go:14/:32) appends on every hook; debug.log is 3.18 MB.
        **Coordination:** fc3cc9e0 commits a94ff8b57 and a09514b65 are on main and marked not complete (bug-369da005). This slice owns the hook-tree tail; the work item links fc3cc9e0 and bug-369da005 and does not touch non-hook code fc3cc9e0 still owns.
        **Depends on 4** so dead db repo code is gone before the hook db path is removed.
      blocks:
        - type: diagram
          title: Hook call today vs after
          fields:
            direction: lr
          entries:
            - hook process starts (58-174 ms init)
            - open file-backed wipnote.db + migrations
            - guards query empty projection
            - append debug.log
            - 'after: lazy templates, no db file, guards read NDJSON/HTML, no debug.log'
    - id: slic-0b3b7eea
      num: 7
      title: Speed up slow CLI paths
      what: Compute linked commits once per feature complete (4-5 identical git log --all --grep runs today); replace WalkAreas per-file LIKE scans with one grouped query; append session HTML events at the tail instead of a full rewrite; make Stop read only new transcript lines; keep the status line off whole-project loads.
