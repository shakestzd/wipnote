meta:
    id: plan-7bc7114c
    track_id: trk-0677c709
    title: Cut bloat and speed up wipnote
    description: 'Fixes from the spk-f72d2045 audit (five read-only audits on 2026-10-25): about 10,000 lines of dead code from the removed dashboard, serve and SQLite eras; hot-path costs on every hook call; duplicated helpers; stale model ids and unused harness features; and the correctness bugs the audit found on the way.'
    created_at: "2026-10-25"
    status: draft
    priority: medium
    schema_version: v4
    version: 11
design:
    problem: ""
    goals: []
    constraints: []
    approved: false
    comment: ""
slices:
    - id: slic-cf011c90
      num: 1
      title: Fix the correctness bugs the audit found
      what: 'Reproduce then fix: claims reconcile/archive treat live sessions as dead (bug-01f182e5); YOLO hasRecentTestRun and hasRecentDiffReview have no canonical source and may block every YOLO commit; claim release and claim heartbeat report success but write to a discarded projection; link.go maps spec- while core uses spc-; wipnote relevant matches a wipnote-item: trailer that 0 of 1322 commits use; launchYoloDev skips enforceLaunchPlan; session HTML writers without the file lock can lose updates; the compliance lock is not exclusive.'
      why: These give wrong answers today. Deleting code around them first would hide the evidence.
      files:
        - cmd/wipnote/claim_ledger.go
        - cmd/wipnote/claim.go
        - core/hooks/yolo_guard.go
        - cmd/wipnote/link.go
        - cmd/wipnote/relevant.go
        - cmd/wipnote/yolo.go
        - core/hooks/session_html.go
        - cmd/wipnote/compliance_auto.go
      deps: []
      done_when:
        - Each bug is reproduced by a failing test before its fix
        - Each claim the audit made but could not reproduce is recorded as not a bug
        - go build/vet/test pass
      effort: M
      risk: Med
      tests: ""
      approved: false
      comment: ""
    - id: slic-a0c20846
      num: 2
      title: Bring model ids and harness features up to date
      what: Replace claude-sonnet-4-6 in compliance_auto.go with the sonnet alias; add Opus/Sonnet/Haiku 5.5 and Fable 5.1 to observe/pricing/models.json; add omitClaudeMd and autoCompactWindow to agentFrontmatterFieldSpecs and set them on patch-coder and researcher; verify and register PreCompact/PostCompact for Codex; move custom skill frontmatter keys under metadata or delete unused ones; replace deprecated bold with weight in mods; confirm Codex agent TOML never emits keys Codex ignores.
      why: Stale ids give wrong cost numbers and old models; new agent fields cut tokens; unused events lose Codex compaction signals.
      files:
        - cmd/wipnote/compliance_auto.go
        - observe/pricing/models.json
        - port/pluginbuild/agent_frontmatter.go
        - port/pluginbuild/hook_event_names.go
        - packages/plugin-core/manifest.json
        - plugin/agents
        - plugin/skills
        - mods
      deps: []
      done_when:
        - No retired model id remains outside history
        - Every new upstream field cites its doc URL in agentFrontmatterFieldSpecs
        - wipnote plugin build-ports runs clean
      effort: S
      risk: Low
      tests: ""
      approved: false
      comment: ""
    - id: slic-8ec9d410
      num: 3
      title: Delete dead code in cmd/wipnote
      what: 'Remove code with no production caller (grep-verified by the audit): serve maintenance loops in config.go; backfill_ai_title.go; SQLite-era plan finalize (finalizeYAMLWithDB and friends); plan_css_scope.go; old plugin install/update helpers; dev-mode backup recovery; test-only gate wrappers; reindex purge helpers; renderSessionShow; small dead funcs; the discarded recap index upsert; Gemini and dashboard leftovers in code and help text. Delete the tests that only exercise them.'
      why: About 2,000 production lines and as many test lines that slow every build and review and mislead readers.
      files:
        - cmd/wipnote
      deps: []
      done_when:
        - golangci-lint unused reports nothing in cmd/wipnote
        - No help text mentions the dashboard or serve
        - Full test suite passes
      effort: M
      risk: Low
      tests: ""
      approved: false
      comment: ""
    - id: slic-cf427ad6
      num: 4
      title: Delete dead code in core
      what: Remove the unused graph SQL query layer (dsl/querybuilder/algorithms/pattern/query/sessions); dead db repo clusters (claims, features, events, messages, plan feedback, rollups, arch, lineage, gate records, pragmas, busy counters); the workitem fluent query API and unused options; dead hook runner plumbing and fallback counters; the never-written active_work_items table and its reads; the unwired Gemini after-model hook and harness emit wrappers; single dead funcs and constants.
      why: About 4,000 lines; several clusters are read on hot paths and always return nothing.
      files:
        - core/graph
        - core/db
        - core/workitem
        - core/hooks
        - core/worktree/repair.go
      deps: []
      done_when:
        - golangci-lint unused reports nothing in core
        - Full test suite passes
      effort: M
      risk: Low
      tests: ""
      approved: false
      comment: ""
    - id: slic-1687e435
      num: 5
      title: Delete serve-era packages in observe, plan and internal
      what: Remove the embedded OTLP receiver (receiver.go/http.go/signalid.go), the QueuedSink and indexer poll loop, plan/planchat and plan/planamend, internal/notebook with its embedded Python and the build sync step, internal/launcher/profile, interview web-form leftovers, dead registry and collector exports; move test-only helpers out of production files.
      why: About 2,000 Go lines and 2,018 Python lines with no importer since f3269ff40.
      files:
        - observe/otel
        - plan/planchat
        - plan/planamend
        - plan/interview
        - internal/notebook
        - internal/launcher/profile
        - internal/registry
        - cmd/wipnote/build.go
      deps: []
      done_when:
        - No package without importers remains except signalvtab (feat-ba544d57)
        - Full test suite passes
      effort: S
      risk: Low
      tests: ""
      approved: false
      comment: ""
    - id: slic-a896a337
      num: 6
      title: Cut per-hook cost
      what: Stop hooks from creating and opening the per-project SQLite cache file (finish feat-fc3cc9e0 in the hook tree); stop querying the empty read-only projection in tooluse_shared, yolo_guard and pretooluse; run guard work only after the tool-type match; memoize session-family and staged-file lookups per process; gate debug.log on WIPNOTE_DEBUG; build plan and recap templates lazily (about 30 ms of init per wipnote process); test whether PostToolBatch or an http hook to the daemon can replace the second per-tool process.
      why: Every tool call and prompt pays these costs; measured examples are 30 ms init, 2-3 ms projection, 2 git spawns and up to 512 KB of JSON per YOLO call.
      files:
        - cmd/wipnote/hook.go
        - core/hooks
        - plan/plantmpl
        - recap/recaptmpl
        - plan/blocks
        - packages/plugin-core/manifest.json
      deps:
        - 4
      done_when:
        - A benchmark shows the pretooluse handler time before and after
        - No hook opens a file-backed SQLite database
        - Hook behaviour tests pass
      effort: L
      risk: Med
      tests: ""
      approved: false
      comment: ""
    - id: slic-0b3b7eea
      num: 7
      title: Speed up slow CLI paths
      what: Compute completion evidence once in feature complete (4 identical git log --all --grep scans today); stop the status line and hook-spawned task-step commands from loading the whole project and rewriting the registry; batch git timestamps for recaps; replace WalkAreas per-file LIKE scans with one grouped query; write OTel replay in chunks; append session HTML events at the tail instead of rewriting the file; make the Stop hook read the transcript once from a saved offset.
      why: feature complete costs about 3 s of git on this repo, code-areas did not finish in 5 minutes, and session HTML and Stop work grow with session length.
      files:
        - cmd/wipnote/workitem.go
        - cmd/wipnote/statusline.go
        - cmd/wipnote/main.go
        - internal/blame
        - observe/otel/indexer
        - core/hooks/session_html.go
        - core/hooks/transcript_assistant.go
      deps: []
      done_when:
        - Timings before and after are recorded for complete and statusline and code-areas
        - Full test suite passes
      effort: L
      risk: Med
      tests: ""
      approved: false
      comment: ""
    - id: slic-3459766c
      num: 8
      title: Merge duplicated helpers
      what: One HTML ledger codec for claim, gate and session ledgers; one ID-prefix to kind/collection table (seven copies disagree today); core git helpers (top-level, branch, output) replacing about ten copies; filelock.Guard everywhere; one env-slice helper; one cached .wipnote/config.json loader; shared OTel adapter base for Gemini/Antigravity; one glob matcher; one plugin asset-tree walker; printJSON and atomic-write helpers.
      why: 'Copies have already drifted: different escaping, different prefixes and different marker parsing.'
      files:
        - core/claimledger
        - core/gateledger
        - core/sessionledger
        - core/models
        - core/paths
        - core/filelock
        - observe/otel/adapter
        - port/pluginbuild
      deps:
        - 3
        - 4
        - 5
      done_when:
        - golangci-lint dupl reports no duplicate over 30 lines in the touched packages
        - Full test suite passes
      effort: M
      risk: Low
      tests: ""
      approved: false
      comment: ""
    - id: slic-80c68005
      num: 9
      title: Split oversized files and functions
      what: 'Split files over 500 lines and functions over 50 lines that remain after slices 3-8: workitem.go and wiSetStatusWithAgent, yolo_guard.go, codex.go, session_start.go and SessionStart, session_end.go, otel receiver writer.go, planyaml validate.go, pretooluse PreToolUse into a guard pipeline.'
      why: The repo rules fail new code over these limits; the remaining big files are where bugs hide.
      files:
        - cmd/wipnote/workitem.go
        - core/hooks
        - cmd/wipnote/codex.go
        - observe/otel/receiver/writer.go
        - plan/planyaml/validate.go
      deps:
        - 8
      done_when:
        - No touched file is over 500 lines
        - No touched function is over 50 lines
        - Full test suite passes
      effort: M
      risk: Low
      tests: ""
      approved: false
      comment: ""
questions: []
