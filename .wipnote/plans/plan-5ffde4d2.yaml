meta:
    id: plan-5ffde4d2
    track_id: trk-0677c709
    title: 'Lean store: keep the records that give context, drop the noise'
    description: 'From spk-bdce0ef0: the useful context in .wipnote is the work-item records and the item ids in commits; session telemetry, per-item bookkeeping commits and stale open items add size and noise. Keep the first, remove the rest.'
    created_at: "2026-10-31"
    status: draft
    priority: medium
    schema_version: v4
    version: 3
design:
    problem: |
        spk-bdce0ef0 ran two A/B tests (plain Claude Code against wipnote claude) and
        audited the store. The context that helped came from the work-item records
        and from item ids in commits and code comments; plain Claude Code found it
        with grep as well as wipnote's commands did. The rest of the store costs more
        than it gives:
        - .wipnote is 151 MB; sessions/ is 129 MB (85%) of telemetry. It is listed in
          .wipnote/.gitignore, but runSync (cmd/wipnote/sync.go:192) collects ignored
          files with --ignored=traditional and stages them with git add -f, so 236
          session files are tracked.
        - 77% of commits in the last 90 days were bookkeeping; 1504 were
          "wipnote: reconcile <id>", one commit per item
          (core/hooks/session_end_reconcile.go:185).
        - 301 items are open, 120 of them older than 90 days, 36 in-progress. Stale
          items give a reader wrong context.
        - About 28% of records state a reason and about 8% have acceptance criteria,
          yet the reason is the part that answered the history question in test 2.
        - Code comments cite 427 item ids. For a teammate without the store, an id
          alone points to nothing.
    goals:
        - 'Size: after slice 1, git ls-files .wipnote/sessions is empty and the tracked .wipnote tree is at least 120 MB smaller.'
        - 'Commit noise: one SessionEnd makes at most one reconcile commit, whatever the number of drifted items.'
        - 'Freshness: after the one-time triage, no todo or in-progress item is older than 90 days without activity unless a person kept it.'
        - 'Record quality: every new feature and bug states why it exists and when it is done.'
        - 'Self-contained code: a comment that cites an item id also states the reason, so the code still makes sense without the store.'
    constraints:
        - Work-item records (features, bugs, spikes, plans, tracks, research, archive) stay canonical and stay in git.
        - No data loss. Telemetry that leaves git stays on disk; stale items are marked, never deleted.
        - The daemon and hooks must never block or slow Claude (user rule).
        - 'Out of scope: the detached no-files store from the earlier design discussion. This plan only shrinks what the in-repo store holds.'
    approved: false
    comment: ""
    research:
        - url: https://git-scm.com/docs/gitignore
          claim: A gitignore pattern has no effect on files git already tracks; the session files must be removed from the index with git rm --cached, and the ignore rule alone will not do it.
          accessed: "2026-10-31"
        - url: https://git-scm.com/docs/git-add
          claim: git add -f stages ignored files; this is how runSync puts sessions/ into commits even though the directory is ignored.
          accessed: "2026-10-31"
        - url: https://git-scm.com/docs/git-rm
          claim: git rm --cached removes paths from the index and keeps the working-tree files, which keeps local telemetry on disk.
          accessed: "2026-10-31"
slices:
    - id: slice-1
      num: 1
      title: Stop committing session telemetry
      what: |
        Change dirtyWipnoteFiles (cmd/wipnote/sync.go) to stage only an allowlist of
        record paths: features/, bugs/, spikes/, plans/, tracks/, research/, archive/,
        recaps/ and architecture.html. Then untrack sessions/ once with
        git rm -r --cached .wipnote/sessions in one commit, keeping the files on disk.
      why: |
        sessions/ is 85% of the store and gave no context in either test. It is
        already meant to be ignored; sync's force-add is the only reason it is in git.
      files:
        - cmd/wipnote/sync.go
        - cmd/wipnote/sync_test.go
      deps: []
      done_when:
        - runSync with dirty files in sessions/ and features/ stages only the features/ file
        - after the migration commit, git ls-files .wipnote/sessions prints nothing and the session files are still on disk
        - git ls-tree -r -l HEAD .wipnote shows at least 120 MB less than before
      effort: S
      risk: Med
      tests: |
        Unit (cmd/wipnote/sync_test.go): TestDirtyWipnoteFiles_AllowlistOnly. Make a
        temp repo with dirty files in sessions/, claims/, features/ and plans/, and
        assert only features/ and plans/ are returned.
      complexity: standard
      approved: false
      comment: ""
      research:
        - url: https://git-scm.com/docs/gitignore
          claim: Ignore rules do not untrack tracked files; a one-time git rm --cached is required.
          accessed: "2026-10-31"
      questions:
        - id: q-ledgers
          text: Should gate-ledger.html, sessions-ledger.html, delegations-ledger.html and claims/ also leave git? The gate ledger backs the completion gate check, and the claim ledger is canonical for claims, so moving them changes behaviour across machines.
      decisions_notes: |
        **Trigger:** wipnote sync and SessionEnd auto-flush.
        **Change:** an allowlist of record directories replaces the denylist.
        **Rejected:** adding more names to isRuntimeStateFile. A denylist goes on
        missing new telemetry files; an allowlist fails safe.
        **Open:** the ledgers (q-ledgers) stay in git until the question is answered.
      blocks:
        - type: file-tree
          title: Files touched
          entries:
            - cmd/wipnote/sync.go
            - cmd/wipnote/sync_test.go
    - id: slice-2
      num: 2
      title: One reconcile commit per session end
      what: |
        SessionEnd reconcile now commits each drifted artifact separately
        (defaultReconcileArtifactCommit, core/hooks/session_end_reconcile.go).
        Collect the drifted paths and commit them together once, with the subject
        "wipnote: reconcile <N> items" and one id per line in the body. With a single
        item, keep the subject "wipnote: reconcile <id>".
      why: |
        1504 reconcile commits in 90 days made bookkeeping 77% of the history. That
        hides real commits in git log and in blame for every reader.
      files:
        - core/hooks/session_end_reconcile.go
        - core/hooks/session_end_reconcile_test.go
      deps: []
      done_when:
        - a SessionEnd with three drifted artifacts makes exactly one commit whose body lists the three ids
        - 'a SessionEnd with one drifted artifact keeps the subject "wipnote: reconcile <id>"'
        - a failed commit is still logged and never fails session exit
      effort: S
      risk: Low
      tests: |
        Unit (core/hooks/session_end_reconcile_test.go): TestReconcile_BatchesCommits.
        Use a temp repo with three drifted artifacts, run reconcile, and assert
        git rev-list --count increases by one and the body has the three ids.
      complexity: standard
      approved: false
      comment: ""
      research_waiver: Internal git usage only; a path-limited git commit with several paths is standard git behaviour already used by runSync.
      decisions_notes: |
        **Trigger:** SessionEnd reconcile.
        **Change:** collect the drifted paths, then make one path-limited commit.
        **Constraint:** SessionEnd must finish inside Claude Code's hook window
        (bug-1daed6d6); one commit is faster than N, so this helps.
        **Rejected:** dropping reconcile commits and leaving the files dirty. The
        records must stay committed to stay canonical.
      blocks:
        - type: file-tree
          title: Files touched
          entries:
            - core/hooks/session_end_reconcile.go
            - core/hooks/session_end_reconcile_test.go
    - id: slice-3
      num: 3
      title: Mark stale open items
      what: |
        Add wipnote stale [--older-than 90d] [--apply]. The dry-run lists todo and
        in-progress features, bugs and spikes with no update in that time. --apply sets
        them to the existing StatusStale, closes their open claims and makes one commit.
        wipnote wip show leaves stale items out unless --all is given.
      why: |
        120 open items are older than 90 days and 36 are stuck in-progress. A session
        that reads them gets wrong context about what is planned or active.
      files:
        - cmd/wipnote/stale.go
        - cmd/wipnote/stale_test.go
      deps: []
      done_when:
        - the dry-run lists only todo and in-progress items whose updated date is older than the threshold, and changes nothing
        - --apply sets those items to stale in one commit and closes their open claims
        - wipnote wip show leaves stale items out by default
        - after the one-time run, the repo has no todo or in-progress item older than 90 days that a person did not keep
      effort: M
      risk: Low
      tests: |
        Unit (cmd/wipnote/stale_test.go): TestStale_DryRunChangesNothing,
        TestStale_ApplyMarksAndCommitsOnce, TestStale_SkipsRecentAndDone. Use
        fixture items with set data-updated dates.
      complexity: standard
      approved: false
      comment: ""
      research_waiver: Internal lifecycle change that reuses the existing StatusStale value; no external dependency or standard applies.
      decisions_notes: |
        **State:** the existing StatusStale value; no new status is added.
        **Rollout:** run it once on this repo after a person reviews the dry-run list.
        **Safety:** dry-run by default; one reviewable commit; nothing is deleted.
        A stale item can go back to todo with the existing reset command.
        **Rejected:** auto-closing as done. That would claim the work happened and
        corrupt lineage.
        **Rejected:** wipnote archive. It moves only done features, and stale items
        must stay visible with --all.
      blocks:
        - type: file-tree
          title: Files touched
          entries:
            - cmd/wipnote/stale.go
            - cmd/wipnote/stale_test.go
    - id: slice-4
      num: 4
      title: New features and bugs state why and when they are done
      what: |
        Add required --why and --done-when flags to feature create and bug create
        (cmd/wipnote/workitem_create.go); spikes keep them optional. buildDescription
        (cmd/wipnote/related.go) writes them as a Why section and Acceptance Criteria.
        A missing flag gives an error that names it. The agent prompt tells agents to
        pass both.
      why: |
        The record's reason is what answered the history question in test 2, but
        only about 28% of records state one and about 8% have acceptance criteria.
      files:
        - cmd/wipnote/workitem_create.go
        - cmd/wipnote/related.go
        - cmd/wipnote/workitem_create_test.go
        - cmd/wipnote/prompts/system-prompt.md
      deps: []
      done_when:
        - feature create and bug create without --why or --done-when exit non-zero and name the missing flag
        - with both flags, the record HTML has a Why section and an Acceptance Criteria section
        - spike create works without the flags
      effort: M
      risk: Med
      tests: |
        Unit (cmd/wipnote/workitem_create_test.go): TestCreate_RequiresWhyAndDoneWhen,
        TestCreate_WritesWhyAndAcceptanceSections, TestSpikeCreate_FlagsOptional.
      complexity: standard
      approved: false
      comment: ""
      research_waiver: CLI flag change inside this repo; no external dependency or standard applies.
      questions:
        - id: q-strict
          text: Should a missing --why fail the command, or warn first for one release so that existing scripts and other harnesses can catch up?
      decisions_notes: |
        **Change:** two required flags on create for features and bugs.
        **Reuse:** buildDescription already renders Acceptance Criteria; only Why is new.
        **Rejected:** enforcing at complete time. By then the reason is
        reconstructed after the fact, and test 2 depended on the reason that was
        written before the work.
        **Risk:** plan promotion (plan_promote_slice.go) creates features too. It must
        fill both fields from the slice's why and done_when.
      blocks:
        - type: file-tree
          title: Files touched
          entries:
            - cmd/wipnote/workitem_create.go
            - cmd/wipnote/related.go
            - cmd/wipnote/workitem_create_test.go
            - cmd/wipnote/prompts/system-prompt.md
    - id: slice-5
      num: 5
      title: Comments that cite an item id also state the reason
      what: |
        Change the commit and comment guidance in the agent prompt
        (cmd/wipnote/prompts/system-prompt.md). A code comment that cites a work-item
        id must also state the reason in plain words. Commit messages keep the id
        in the subject or a Refs trailer.
      why: |
        Go code cites 427 item ids in 2054 comments. They lead a wipnote user to the
        record, but for a teammate without the store an id alone says nothing.
      files:
        - cmd/wipnote/prompts/system-prompt.md
      deps: []
      done_when:
        - the prompt has the rule and one good and one bad example
      effort: S
      risk: Low
      tests: ""
      complexity: trivial
      approved: false
      comment: ""
      research_waiver: Prompt wording change only.
      decisions_notes: |
        Prompt-only. Existing comments are not rewritten in this plan.
      blocks:
        - type: file-tree
          title: Files touched
          entries:
            - cmd/wipnote/prompts/system-prompt.md
questions: []
