questions:
    - id: q-adopt-vs-port
      text: Adopt or wrap the herdr plugin herdr-orch, or port orch?
      description: 'herdr-orch (MIT, Go, v0.1.2) covers spawn, send, wait, result, stop and questions, and gives a board instead of a tree. It needs its own daemon and SQLite outside .wipnote/ and has no work-item link. It does not cover one-shot codex exec runs. ANSWERED 2026-10-25 by the owner: port orch natively in Go; herdr-orch stays prior art only.'
      options:
        - key: port-orch
          label: Port orch to Go as planned; take ideas from herdr-orch, cbds, pod and herdr-mail
        - key: wrap-horch
          label: Wrap horch for interactive sessions; build only one-shot runs, the ledger and lineage in wipnote
        - key: adopt-horch
          label: Adopt herdr-orch as the engine and contribute the missing parts upstream
      answer: port-orch
    - id: q-command-name
      text: What is the command name?
      description: 'The plan uses wipnote delegate with spawn, send, wait, result, stop, questions, tree, run, list, view, inbox and doctor. ANSWERED 2026-10-25 by the owner: wipnote delegate.'
      options:
        - key: delegate
          label: wipnote delegate
        - key: agent
          label: wipnote agent
        - key: other
          label: Another name
      answer: delegate
    - id: q-live-store
      text: Where does live run state live?
      description: 'Live state means run folders, events and the mailbox. A container worker must reach it. The project root is shared through the bind mount; a per-user cache is not. ANSWERED 2026-10-25 by the owner: project .wipnote/delegate/, gitignored; only ledger rows are committed. The gitignore entry is part of slice 5.'
      options:
        - key: project-runtime
          label: .wipnote/delegate/ in the project, gitignored like sessions/
        - key: user-cache
          label: The per-user wipnote cache for the project
        - key: configurable
          label: project-runtime by default, with an environment override for a shared mount
      answer: project-runtime
    - id: q-intercept
      text: How should a bare codex exec or claude -p in the Bash tool be handled?
      description: 'On Codex, a rewrite needs permissionDecision allow, which auto-approves the call. ANSWERED 2026-10-25 by the owner: deny-redirect now; bare codex exec and claude -p must use wipnote delegate. The owner also asked to research making delegated runs interactive: if an interactive session can be given the same load control as a headless run, headless runs are not needed, because a human and the delegator can both talk to an interactive worker. Spike spk-87139e0e checks this parity; slice 8 waits on it.'
      options:
        - key: deny-redirect
          label: Deny with a reason; the model re-runs it as wipnote delegate run (no permission change)
        - key: rewrite-ask
          label: Rewrite with ask on Claude Code and deny-redirect on Codex
        - key: rewrite-allow
          label: Rewrite with allow on both (widens permission)
        - key: none
          label: No interception; guidance only
      answer: deny-redirect
    - id: q-claude-pane
      text: Outside herdr, does a Claude Code pane still show the run?
      description: 'The mod''s claudePane auto mode uses the Claude Code mods UI, which Go cannot drive. ANSWERED 2026-10-25 by the owner: orchestra should be part of delegate. The run view folds into the wipnote-orchestra mod. NOTE 2026-10-25 (owner): merge the wipnote-orchestra mod into delegate; its code and release move under the delegate feature (slice 19).'
      options:
        - key: drop
          label: Drop it; run.html and wipnote delegate view cover it
        - key: orchestra
          label: Fold a view-only run pane into the wipnote-orchestra mod
        - key: thin-mod
          label: Keep a thin view-only mod that reads the run store
      answer: orchestra
    - id: q-viewer
      text: Keep the Python Textual pane viewer?
      description: 'The mod''s textual viewer needs uv and downloads Textual on first run. Slice 7 adds a plain Go viewer. ANSWERED 2026-10-25 by the owner: the Go viewer only (wipnote delegate view); the Textual viewer goes.'
      options:
        - key: go-plain
          label: Replace it with the Go viewer (wipnote delegate view)
        - key: keep-textual
          label: Keep Textual as an option (needs uv)
      answer: go-plain
    - id: q-label
      text: What label goes into the committed ledger?
      description: 'The mod derives a 48-character label from the prompt, and a prompt can hold sensitive text that git would then keep. ANSWERED 2026-10-25 by the owner: only an explicit --label goes into the ledger; derived labels stay in the run folder.'
      options:
        - key: explicit-only
          label: Only an explicit --label; derived labels stay in the run folder
        - key: derived
          label: The derived 48-character label
        - key: none
          label: No label in the ledger
      answer: explicit-only
    - id: q-worker-claim
      text: Does a spawned worker claim the work item?
      description: 'The ledger tag links the run either way. A claim also attributes the worker''s edits and commits to the item. ANSWERED 2026-10-25 by the owner: the worker claims the work item (chosen over link-only). The handoff with the orchestrator''s claim is q-claim-handoff; several workers on one item is q-concurrent-workers.'
      options:
        - key: link-only
          label: No claim; the ledger tag links it
        - key: shared-claim
          label: The worker starts the same work item (shared claim)
      answer: shared-claim
    - id: q-codex-sandbox
      text: What happens when Codex's sandbox fails (bwrap in a container)?
      description: 'Codex''s bwrap sandbox fails in this devcontainer. danger-full-access is safe only when the container is the isolation boundary. ANSWERED 2026-10-25 by the owner: refuse by default with the probe output; a per-host setting can pass --sandbox danger-full-access.'
      options:
        - key: refuse
          label: Refuse with the probe output and the fix options
        - key: per-host-optin
          label: Allow a per-host setting that passes --sandbox danger-full-access
        - key: auto-fallback
          label: Fall back to danger-full-access automatically in containers
      answer: per-host-optin
    - id: q-orch-import
      text: Import orch history into the ledger?
      description: 'orch''s registry holds past runs with work-item tags. Without an import, lineage loses them when orchlink is deleted. ANSWERED 2026-10-25 by the owner: one-shot wipnote delegate import-orch, then delete orchlink.'
      options:
        - key: import
          label: One-shot wipnote delegate import-orch, then delete orchlink
        - key: no-import
          label: No import; keep orchlink until orch is no longer used, then delete it
      answer: import
    - id: q-orch-source
      text: How does the orch source enter the repo?
      description: 'The license and any host paths in it are unknown. ANSWERED 2026-10-25 by the owner: README and inventory only; the orch source stays outside the repo.'
      options:
        - key: snapshot
          label: A scrubbed snapshot under docs/reference/orch/
        - key: inventory-only
          label: README and inventory only; the source stays outside the repo
      answer: inventory-only
    - id: q-chained
      text: Should chained delegations (pipes, ;) be wrapped in v1?
      description: 'The mod wraps them with shell shims. The plan passes them through unchanged in v1. ANSWERED 2026-10-25 by the owner: scope it for v2; v1 does not wrap chained delegations.'
      options:
        - key: later
          label: Later, if usage shows the need
        - key: v1
          label: In v1, before the mod is removed
      answer: later
    - id: q-answer-questions
      text: Can the orchestrator answer a worker's question?
      description: 'orch only lists pending questions. Answering means typing into the worker''s pane or a blocking ask/reply protocol. ANSWERED 2026-10-25 by the owner: also answer (ask/reply, as herdr-orch does), in v1. NOTE 2026-10-25 (owner): the orchestrator answers by typing into the worker''s herdr pane; no blocking hook and no reply-file protocol (slice 17). Spawn returns with status starting; the bind and brief happen in the pane (slice 10).'
      options:
        - key: list-only
          label: List only (orch parity)
        - key: answer
          label: Also answer it (as herdr-orch ask/reply does)
      answer: answer
    - id: q-mod-removal
      text: When is mods/codex-herdr-pane removed?
      description: 'Removal in the same release gives one path at once. One release later gives mod users time to move settings. ANSWERED 2026-10-25 by the owner: remove the mod in the release that ships delegate run and the redirect.'
      options:
        - key: same-release
          label: In the release that ships delegate run and the redirect
        - key: one-release-later
          label: One release later, after a deprecation notice
      answer: same-release
    - id: q-antigravity
      text: Are Antigravity workers in scope for v1?
      description: 'Antigravity is a supported harness, but no verified upstream doc set exists yet, and entwurf reports its native push as paused. ANSWERED 2026-10-25 by the owner: no; Claude and Codex only in v1.'
      options:
        - key: "no"
          label: No; Claude and Codex only
        - key: "yes"
          label: Yes, as a third spawn harness
      answer: "no"
    - id: q-claim-handoff
      text: When a spawned worker claims the work item, what happens to the orchestrator's claim?
      description: 'A worker''s claim episode is keyed by its own session (rootSessionFor falls back to the session id), so today feature start''s collision gate (checkLiveCollisionGate) refuses the worker while the orchestrator holds a live claim. Episodes have four outcomes only (completed, released, abandoned, expired), so "suspend" has no outcome of its own: it equals release plus an automatic reclaim. In every option, completion by either side closes every open episode on the item (CloseWorkItem). ANSWERED 2026-10-25 by the owner: co-claim, workers count as family. The orchestrator keeps its claim; the claim gate treats the caller''s live workers, read from the delegations ledger (caller_session, worker_sessions), as its own family, so neither blocks the other; the orchestrator can still review and complete the item.'
      options:
        - key: co-claim-gate
          label: 'Co-claim: the orchestrator keeps its episode, the worker opens its own in its own shard, and the collision gate treats the caller''s live workers (from the delegations ledger) as family'
        - key: co-claim-family
          label: 'Co-claim: the worker''s episode goes into the caller''s shard (root = caller), so the existing family rule admits it. Risks: reconcile expires the worker''s rows once the caller''s tree is dead, and two hosts write one shard (Phase B check B7)'
        - key: release-reclaim
          label: 'Release: the orchestrator''s episode closes as released at spawn; its next delegate call (wait, stop or list) after the last worker ends reopens a claim for it'
      answer: co-claim-gate
    - id: q-concurrent-workers
      text: Can several workers hold claims on one work item at the same time?
      description: 'Each worker holds its own episode. The collision gate refuses a second live claimant unless it counts as family (see q-claim-handoff). Workers editing one item in one working tree can overwrite each other. ANSWERED 2026-10-25 by the owner: one worker per item in v1; spawn refuses a second live worker on an item that already has one.'
      options:
        - key: allow-n-worktrees
          label: Allow several, each in its own worktree; all count as family of the same caller
        - key: one-per-item
          label: One live worker per work item; spawn refuses a second
        - key: allow-n-shared-tree
          label: Allow several in one working tree, with no isolation
      answer: one-per-item
critique:
    reviewed_at: "2026-10-25"
    reviewers:
        - local-design
        - local-feasibility
    assumptions:
        - id: A1
          status: verified
          text: A Codex PreToolUse hook can deny a Bash call with a reason.
          evidence: 'learn.chatgpt.com/docs/hooks: deny is supported; ask is parsed but not supported.'
        - id: A2
          status: verified
          text: Claude Code PreToolUse accepts updatedInput with allow or ask.
          evidence: 'code.claude.com/docs/en/hooks. Not used: the owner chose deny-redirect only.'
        - id: A3
          status: falsified
          text: herdr agent start can run a custom command such as wipnote claude.
          evidence: 'herdr.dev/docs/agent-automation/: agent start cannot run a custom command. Slice 10 uses pane run with a quoting helper.'
        - id: A4
          status: verified
          text: herdr agent wait observes agent state, not job completion.
          evidence: herdr.dev/docs/agents/. Slice 11 settles on the worker's Stop event.
        - id: A6
          status: questionable
          text: Hooks given through --settings add to plugin hooks.
          evidence: 'Partly answered by mac-evidence (2026-10-25): wipnote claude rejects --settings as its own flag; after `--` orch''s hooks fired. Whether wipnote''s plugin hooks fire beside them is still open (Phase B B1). Affects only orch during migration.'
        - id: A7
          status: unverified
          text: Codex hooks fire under codex exec.
          evidence: learn.chatgpt.com/docs/hooks is silent on exec mode. Phase B check B5, bug-3e4c6e02.
        - id: A8
          status: verified
          text: A live Claude Code session can be renamed with the sessionTitle hook output.
          evidence: 'code.claude.com/docs/en/hooks: sessionTitle on UserPromptSubmit and SessionStart. Slice 15.'
        - id: A9
          status: unverified
          text: Codex supports naming a session.
          evidence: No Codex doc found. Slice 15 records the result instead of writing code.
        - id: A10
          status: falsified
          text: A gitignore policy change reaches existing projects.
          evidence: 'core/worktree/gitignore.go:10-19: create-if-missing only. Slice 5 adds an upgrader.'
        - id: A11
          status: verified
          text: A worker's claim episode is rooted at its own session.
          evidence: 'cmd/wipnote/claim_ledger.go:74-90: rootSessionFor falls back to the session id. Slice 10 tests it (TestSpawn_WorkerShardIsOwnRoot).'
        - id: A13
          status: unverified
          text: The herdr-plugin prior-art facts (versions, licenses, features) are correct.
          evidence: The repos were not reachable in this review. The survey table stays reference data only.
        - id: A15
          status: plausible
          text: A worker runs `<kind> start <id>` from its brief.
          evidence: The brief is the worker's first prompt. wait and list check that the episode appeared and report it if not.
        - id: A16
          status: unverified
          text: A digit key selects an AskUserQuestion option in a worker's pane.
          evidence: No evidence. Phase B check B9; slice 17 refuses option answers until it passes.
        - id: A17
          status: verified
          text: wipnote claude and wipnote codex both take --resume <id>.
          evidence: cmd/wipnote/claude.go (resume flag) and cmd/wipnote/codex.go (passes codex resume <id>). Slice 20 reuses them.
        - id: A18
          status: verified
          text: wipnote codex already falls back to danger-full-access in a devcontainer when bwrap fails, unless --sandbox is given.
          evidence: resolveCodexSandboxMode and codexRequestedSandbox in cmd/wipnote/codex_launch.go. Slice 12 always passes --sandbox.
        - id: A19
          status: verified
          text: The devcontainer CLI's up and exec take --workspace-folder, and up reports remoteWorkspaceFolder.
          evidence: github.com/devcontainers/cli README; scripts/devcontainer.sh uses both. Slice 21.
        - id: A20
          status: questionable
          text: orch's registry carries a work-item tag that import-orch can keep.
          evidence: The orch 0.1.0 registry has no work-item field (inventory section 8), but internal/orchlink reads a work_item field. Slice 18 links by session id and keeps work_item only when present.
        - id: A21
          status: plausible
          text: Container hooks can write the host's .wipnote/delegate/ through the workspace mount.
          evidence: 'mac-evidence: 800 of 800 hook lines reached the shared mount; no ledger row was checked (Phase B B6).'
    critics:
        - title: Design
          sections:
            - heading: Scope and owner decisions
              items:
                - badge: Fixed
                  kind: danger
                  text: 'Slice 1 planned a source snapshot, but the owner chose inventory-only. Fixed in this revision: README plus inventory and PROVENANCE.md; no orch code in the repo.'
                - badge: Fixed
                  kind: danger
                  text: 'Slice 9 kept rewrite-ask and rewrite-allow, but the owner chose deny-redirect only. Fixed in this revision: deny with the exact delegate run argv, a loop guard, and the rewrite modes moved to Rejected.'
                - badge: Fixed
                  kind: warn
                  text: 'Answering worker questions was deferred, but the owner chose answer. Fixed in this revision: new slice 17 types the answer into the worker''s herdr pane.'
                - badge: Fixed
                  kind: warn
                  text: 'The orch import was optional, but the owner chose import. Fixed in this revision: new slice 18 import-orch; slice 13 deletes orchlink after it.'
                - badge: Fixed
                  kind: warn
                  text: 'q-claude-pane was still open in slice 14. Fixed in this revision: new slice 19 merges wipnote-orchestra into delegate.'
            - heading: Structure and size
              items:
                - badge: Fixed
                  kind: warn
                  text: 'Slice 10 done_when was far over the word norm and mixed spawn with claims. Fixed in this revision: claims moved to new slice 16.'
                - badge: Fixed
                  kind: warn
                  text: 'pretooluse.go is 1188 lines. Fixed in this revision: new code goes in core/hooks/pretooluse_delegate.go.'
                - badge: Fixed
                  kind: warn
                  text: Slice 15 had no complexity, notes, research or blocks. Fixed in this revision.
                - badge: Fixed
                  kind: success
                  text: 'Committed labels follow q-label: explicit --label only. Fixed in this revision in slices 4 and 8 (TestRun_DerivedLabelNotInLedger).'
            - heading: Owner decisions 2026-10-25 (round 3)
              items:
                - badge: Fixed
                  kind: warn
                  text: 'R: the worker''s result file is the result; the Stop hook only marks a turn end. Applied in slices 5, 10 and 11, and to q-settle.'
                - badge: Fixed
                  kind: warn
                  text: 'S: the Codex sandbox ladder (read-only, --write, opted-in danger-full-access) is in slice 12.'
                - badge: Fixed
                  kind: warn
                  text: 'C: new slice 21 runs workers in the project''s own devcontainer; slices 8 and 10 point to it.'
                - badge: Resolved
                  kind: success
                  text: 'L (resolved 2026-10-25): the owner chose exactly orch''s layout: one workers tab per caller in the caller''s workspace, each new worker a split inside it, cap 6. Slices 6, 10 and 19 fixed; tests cover the 2nd worker splitting the tab and the 7th refused.'
                - badge: Fixed
                  kind: success
                  text: D1 to D8 are two-sided regression tests in slices 5, 10, 11 and 17.
                - badge: Fixed
                  kind: warn
                  text: 'E: new slice 20 resumes a stopped worker. It also depends on slice 21 so that a container run resumes in its container; the owner listed only slices 10 and 4.'
        - title: Feasibility
          sections:
            - heading: Harness and herdr contracts
              items:
                - badge: Fixed
                  kind: danger
                  text: 'herdr agent start cannot run a custom command (A3). Fixed in this revision: spawn uses pane run with a shell-quoting helper and inline env prefixes.'
                - badge: Fixed
                  kind: warn
                  text: 'Codex parses ask but does not support it (A1). Fixed in this revision: deny is the only mode on both harnesses.'
                - badge: Open
                  kind: warn
                  text: Codex hooks under exec (A7) and Codex session naming (A9) stay unverified; Phase B and slice 15 record the results.
            - heading: Sessions and claims
              items:
                - badge: Fixed
                  kind: danger
                  text: 'Inherited WIPNOTE_PARENT_SESSION and WIPNOTE_NESTING_DEPTH would mark a worker as a subagent of the caller. Fixed in this revision: spawn scrubs them and tests that the worker is its own root.'
                - badge: Fixed
                  kind: danger
                  text: 'Slice 10 set sessions.parent_session_id to the caller, which contradicts the root-session rule. Fixed in this revision: the caller is stored only as delegate_caller_session.'
                - badge: Fixed
                  kind: warn
                  text: 'Spawn waited for the bind before returning. Fixed in this revision (decision F): spawn returns within 3 s with status starting; bind and brief happen in the pane.'
                - badge: Blocked
                  kind: warn
                  text: The live-worker gate needs bug-01f182e5 fixed first. Slice 16 records it as a hard blocker.
            - heading: Store and settings
              items:
                - badge: Fixed
                  kind: danger
                  text: 'The gitignore policy never reaches an existing project (A10). Fixed in this revision: slice 5 adds an upgrader and a done_when for an existing checkout.'
                - badge: Fixed
                  kind: warn
                  text: 'The Codex sandbox opt-in had no named setting. Fixed in this revision: user config delegate.codex.dangerFullAccessHosts, and slice 12 reuses codexSandboxProbe.'
            - heading: orch inventory findings
              items:
                - badge: Fixed
                  kind: danger
                  text: 'Slice 10''s stop closed the pane before checking processes, but process-info is gone once the pane closes. Now: record pids with start times first, close only at a bare shell, check pids after, never signal.'
                - badge: Fixed
                  kind: danger
                  text: Slice 10 typed the brief inline in pane run; macOS rejects long input lines. Now the brief goes by file path through a short boot line, typed only after the shell settles.
                - badge: Fixed
                  kind: warn
                  text: Slice 6 lacked send-text, send-keys, agent rename and list, tab create and close, and pinning. It now treats herdr exit 2 as a usage error, never a timeout (orch P-8).
                - badge: Fixed
                  kind: warn
                  text: Slice 17 now types with send-text plus enter, refuses a pin mismatch and refuses while a permission dialog shows.
                - badge: Fixed
                  kind: warn
                  text: Ids are now 12 hex or more (orch P-6). Do-not-copy bugs F-1 (slice 11), F-4 (slice 7) and quadratic redaction (slices 5, 7) are now tests.
                - badge: Fixed
                  kind: warn
                  text: Slice 18 links imported rows by session id, reads archived mailboxes, takes --mail-root, and reads event format v1 and v2.
                - badge: Resolved
                  kind: success
                  text: 'F-1 (resolved 2026-10-25): the owner kept the design. wait writes the ledger only under the ledger lock and only on an open row, so a stop always wins (q-wait-writes). Two-sided test in slice 11.'
                - badge: Resolved
                  kind: success
                  text: 'ccx redirect (resolved 2026-10-25): a bare ccx task is denied with the translated `wipnote delegate run --container -- <task args>`, the one exception to slice 9''s exact-argv rule, tested as its own case.'
    risks:
        - risk: Inherited WIPNOTE_* session env mis-parents a worker as a subagent of its caller.
          severity: High
          mitigation: spawn scrubs the env; TestSpawn_ScrubsInheritedSessionEnv and TestSpawn_WorkerShardIsOwnRoot.
        - risk: The live-worker gate expires workers before bug-01f182e5 is fixed.
          severity: High
          mitigation: Hard blocker on slice 16.
        - risk: Typing answers into a pane is fragile across herdr versions.
          severity: Medium
          mitigation: Contract-test against the herdr stub; refuse outside herdr.
        - risk: herdr CLI drift breaks the adapter.
          severity: Medium
          mitigation: Contract tests per herdr release.
        - risk: delegations-ledger.html merge conflicts across worktrees.
          severity: Low
          mitigation: Append-only rows, like the sessions ledger.
        - risk: Same-release mod removal strands users of the mod's settings.
          severity: Medium
          mitigation: A one-time notice names the new settings.
        - risk: A devcontainer's first build makes a container worker slow to start.
          severity: Medium
          mitigation: devcontainer up runs in the worker's pane, so spawn still returns starting at once (slice 21).
        - risk: A run folder is swept before a resume.
          severity: Low
          mitigation: Resume refuses with that reason (slice 20).
        - risk: wait trusts hook state alone, so it hangs on a stuck working state or a stopped session, and misses questions the worker writes as files (orch defect, Mac evidence 2026-10-25).
          severity: High
          mitigation: Outbox result and q-files count even when hooks are silent; a stopped session ends wait at once; a grey input-line suggestion never reads as working. Two-sided tests in slices 10 (D8), 11 (D1b, D7, D8) and 17 (D7).
    synthesis: 'All danger items are fixed in this revision. Blockers left: spike spk-87139e0e decides whether delegate run keeps a headless path (slice 8); bug-01f182e5 must be fixed before the worker claim gate (slice 16); slice 1 needs the owner''s orch source; slice 2 must run on the owner''s Mac. The reviewer should look first at slices 10 and 16 (claims), slice 17 (typing answers into panes) and slice 19 (the orchestra merge). Round 3 (2026-10-25): owner decisions R, S, C, L, D and E and the orch inventory findings are applied. New slices: 20 (resume) and 21 (devcontainer workers). The owner then resolved the open points: layout is exactly orch''s (one workers tab per caller, splits, cap 6); wait may write the ledger only under the lock on an open row (F-1); the ccx deny reason shows the --container form (slice 9 exception).'
