          title: Redirect modes (q-intercept)
          rows:
            - body: Both harnesses. The model re-issues wipnote delegate run -- <cmd>; normal permission checks apply. One extra turn.
              label: deny-with-reason
            - body: 'Claude Code only. updatedInput plus ask: the user sees the rewritten command.'
              label: rewrite-ask
            - body: 'Both, opt-in only. updatedInput plus allow: no prompt, so permission widens.'
