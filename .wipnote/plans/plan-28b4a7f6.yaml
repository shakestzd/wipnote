    - id: slic-3d4a6f44
      feature_id: feat-dd8b0cde
      num: 4
      title: 'Delegation-run ledger: one canonical record per run'
      what: Add core/delegationledger, which owns .wipnote/delegations-ledger.html with one row per run. Open appends a row at spawn. Close sets the end time, exit and reason. Enrich adds usage and session ids. One row type serves one-shot and interactive runs (Q4). Reindex reads the ledger. No field holds an absolute path.
      why: Delegations leave only hook events today (feat-dd8b0cde). Q3 decided that spawn and stop become records. A canonical row survives cache purges and appears in lineage.
      files:
        - core/delegationledger/record.go
        - core/delegationledger/ledger.go
        - core/delegationledger/store.go
        - core/delegationledger/ledger_test.go
        - cmd/wipnote/reindex_delegation_ledger.go
      deps: []
      done_when:
        - Open, Close and Enrich round-trip every field through the HTML, and reindex yields the same rows
        - Concurrent Open calls from 8 goroutines and 2 processes lose no row (core/filelock.Guard)
        - A field holding an absolute host path or a home directory is refused at write time
        - A torn last row is detected and repaired the way core/sessionledger does it
        - 'A read helper answers the claim gate''s two questions from one parse: the open interactive rows for a work item (caller_session, worker_sessions), and the open row for a run id'
      effort: M
      risk: Med
      tests: |
        Unit: TestLedger_OpenCloseEnrichRoundTrip, TestLedger_ConcurrentOpen, TestLedger_RefusesHostPath, TestLedger_TornTailRepair, TestLedger_OpenInteractiveRowsForItem, TestLedger_OpenRowByRunID.
        Integration: TestReindex_DelegationLedgerRows.
      complexity: complex
      approved: false
      comment: ""
      research_waiver: Follows the in-repo core/sessionledger and core/gateledger pattern. No external standard applies.
      questions:
        - id: q-one-type
          text: One record type for one-shot and interactive runs (Q4)?
          answer: Yes. One row type with mode=oneshot or interactive. Both share tool, label, work item, times, exit and usage. The dashboard is gone, so only lineage and the CLI read it (orch-integration.md Q4).
      decisions_notes: |
        **Trigger:** delegate run and spawn call Open. Exit, stop or pane loss call Close. The usage parser calls Enrich.
        **State:** one shared canonical table. Open appends at the tail. Close and Enrich do a read-modify-write under core/filelock.Guard with temp file plus rename (core/sessionledger precedent).
        **Payload:** see the data-model block. An interactive run can hold many worker sessions, because /clear gives a new session id.
        **Q3:** spawn and stop persist. Tool, prompt and turn-stop events do not: they duplicate agent_events.
        **Rejected:** one HTML file per run (a file per codex exec call, and lineage would have to glob them all). Per-session shards are rejected because lineage queries by work item. SQLite only is rejected because it is purgeable (bug-550c1cd8).
        **Commit:** rows go through the existing artifact commit path. No write waits on the daemon.
        **Claims (q-claim-handoff answered: co-claim-gate):** the claim gate reads mode, work_item, ended, caller_session and worker_sessions. Only open interactive rows count. The read helper returns ok=false on an unreadable ledger, so the gate fails open. worker_sessions must hold every session a worker has used, because the gate matches episodes by session id.
        **Promotion:** feature_id is feat-dd8b0cde, so promote-slice reuses it instead of creating a duplicate.
        **Parallel:** yes, with slices 1, 2, 5 and 6.
