      decisions_notes: |
        **Trigger:** called by delegate run, spawn, send and stop.
        **State:** stateless. Pane ids live in the run folder.
        **Payload:** typed results (pane id, agent state, process list).
        **Choice:** use the herdr CLI, not the socket API. herdr-orch pins socket protocol 22, which changes between releases, and the CLI is the documented surface.
        **Rejected:** packaging wipnote as a herdr plugin (herdr-plugin.toml). herdr has no shutdown hook and does not supervise daemons, and wipnote must also work outside herdr.
        **Checked 2026-10-25:** herdr agent start cannot run a custom command such as wipnote claude (herdr agent-automation docs). spawn uses pane run, which takes a shell string.
        **Parallel:** yes, with slices 1, 2, 4 and 5.
        **Detect:** herdr is present only when HERDR_ENV=1. HERDR_PANE_ID names the caller's pane only then; it gives the caller's workspace for new tabs.
        **Errors:** herdr prints a JSON error on stderr with exit 1, and exit 2 for a syntax error. Exit 2 is classified before any text is scanned, so `unknown option` is never read as a timeout (orch P-8).
        **Fake:** port the script format and reply shapes of the orch-conformance Node fake for herdr, checked against herdr's api-schema (protocol 22). Every call must be scripted; an unscripted call fails loudly.
        **Layout (decision L, ANSWERED 2026-10-25, corrected):** exactly as orch (orch src/orch/service/placement.py:place). The first worker creates ONE workers tab in the caller's workspace (from HERDR_PANE_ID) and uses its root pane. Later workers split inside that tab: the 2nd splits the first pane right, the 3rd the first pane down, the 4th the second pane down, the 5th and 6th the largest pane. Cap 6 live workers. The caller's own tab is never split. When the tab's last worker stops, delegate closes it (only a tab it created).
