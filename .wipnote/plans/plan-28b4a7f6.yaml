      num: 5
      title: 'Live run store: run folders, events and a file mailbox'
      what: Add internal/delegate/runstore with a run directory per run (the feat-a1df60c2 run-folder contract), per-writer events NDJSON files and a file mailbox (one JSON file per message, temp file plus rename). It lives in .wipnote/delegate/, gitignored like sessions/; only ledger rows are committed. Finished runs are swept after N days.
      why: One-shot runs, interactive sessions, hooks and the mailbox need one shared runtime layout. It must survive a crashed caller and work with no daemon.
      files:
