      why: orch's interactive sessions are the half the mod never covered. Running workers under wipnote's launchers gives them wipnote hooks and lineage, and the owner chose that each worker claims its work item (q-worker-claim).
      files:
        - cmd/wipnote/delegate_spawn.go
        - cmd/wipnote/delegate_stop.go
        - cmd/wipnote/delegate_tree.go
        - internal/delegate/session/spawn.go
        - internal/delegate/session/stop.go
        - internal/delegate/session/tree.go
        - internal/delegate/session/session_test.go
        - core/hooks/session_start.go
        - core/hooks/delegate_bind.go
        - cmd/wipnote/claim_ledger.go
        - core/hooks/claim_episodes.go
      deps:
        - 1
        - 2
        - 4
        - 5
        - 6
      done_when:
        - spawn returns within 3 s with the run id, pane id and name, and refuses a name that is already live
        - After /clear in the worker, the run lists both session ids
        - stop reports verified only when the pane is gone and no worker process remains; otherwise it names what survives
        - tree shows caller, run, worker sessions and sub-agents, reusing RenderAgentTree
        - The SessionStart bind adds under 2 ms and never fails the hook
        - Within 10 s of spawn, .wipnote/claims/ holds an open episode for the work item and the worker session, written by the normal wipnote <kind> start path
        - spawn refuses when no work item resolves (no --work-item and no active claim in the caller)
        - After stop, crash or pane loss, no episode stays open for the worker session (abandoned on stop, expired on loss), and the orchestrator's episode stays open
        - The claim gate admits the worker beside the orchestrator and the orchestrator beside its worker, and still refuses an unrelated live session
