        - core/worktree/gitignore.go
      deps:
        - 1
      done_when:
        - Two processes writing events for one run never write the same file, and a reader merges them in seq order
        - A partial last NDJSON line and a half-written message file are skipped, never parsed
        - The run-folder file names match the feat-a1df60c2 contract, and the mod's viewer can read a run folder written by Go
        - The managed .wipnote/.gitignore block (core/worktree/gitignore.go) ignores delegate/, and git status shows nothing under .wipnote/delegate/ after a run
      effort: M
      risk: Med
      tests: |
        Unit: TestRunStore_OneWriterPerFile, TestRunStore_SkipsPartialLine, TestMailbox_AtomicDeliver, TestSweep_KeepsLiveRuns, TestGitignore_IgnoresDelegate.
        Contract: TestRunFolder_MatchesModContract (uses mods/codex-herdr-pane/test/fixtures).
      complexity: complex
      approved: false
      comment: ""
      research:
        - url: https://github.com/husniadil/herdr-mail
          claim: 'Store-authoritative mailbox: herdr agent prompt gives no receipt, so every message must be readable from the store.'
          accessed: "2026-10-25"
        - url: https://github.com/zqkra/cbds
          claim: A durable, fsynced report written before anyone is told; a later wait returns it at once.
          accessed: "2026-10-25"
      questions:
        - id: q-append
          text: Do several processes ever append to one file?
          answer: No. Each writer owns its files (events-<writer>.ndjson, one file per message). The arch card daemon-purpose-outlives-sqlite records that O_APPEND is not atomic on APFS. flock across a host-container bind mount is unverified (Phase B check B7).
      decisions_notes: |
        **Trigger:** delegate run and spawn create a run directory. Hooks in a tagged worker write events. send writes messages.
        **State:** <root>/runs/<run-id>/ holds the run-folder files and events-*.ndjson. <root>/mail/<name>/ holds messages. <root> is .wipnote/delegate/ (q-live-store, owner 2026-10-25).
        **Payload:** see the data-model blocks. Files are written by temp file plus rename and fsynced before rename.
        **Gitignore:** this slice adds delegate/ to the managed block that core/worktree/gitignore.go writes, beside sessions/, events/ and logs/.
        **Why the project root:** a container worker reaches it through the same bind mount as the code. A per-user cache differs between the Mac and the container.
        **Rejected:** one shared events.ndjson with flock, because of APFS O_APPEND and an unverified flock across the mount. SQLite for live state is rejected: it adds a writer and a lock to every hook.
        **Refine:** after slice 1, check the layout against orch's mailbox and record any difference in docs/design/orch-inventory.md.
        **Parallel:** yes, with slices 4 and 6 once slice 1 is done.
      blocks:
        - type: data-model
          title: Run folder
          fields:
            name: <root>/runs/<run-id>/
          rows:
            - name: raw.log
              type: harness output as captured
            - name: clean.log / clean.md
              type: filtered log, Markdown with safe fencing
            - name: last.md
              type: final answer
            - name: usage
              type: one-line token summary
            - name: start / end
              type: unix seconds
            - name: exit
              type: int; its presence ends the run
            - name: label / host
              type: pane title; claude | herdr | none
            - name: run.html
              type: rendered page
            - name: events-<writer>.ndjson
              type: '{v, seq, ts, run, kind, sid, turn, agent_id}'
        - type: data-model
          title: Mailbox message
          fields:
            name: <root>/mail/<name>/<seq>-<msg-id>.json
          rows:
            - name: id
              type: string msg-<8 hex>
            - name: from
              type: caller session id or human
            - name: to
              type: run name
            - name: body
              type: string
            - name: turn
              type: int turn id the message starts
            - name: created
              type: RFC3339
            - name: hinted
              type: 'bool: herdr agent prompt succeeded'
