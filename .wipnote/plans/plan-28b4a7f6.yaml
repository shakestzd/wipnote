      questions:
        - id: q-settle
          text: What settles a wait?
          answer: 'A durable signal. That is the worker''s Stop hook event for the current turn (with the last assistant message) or an explicit report. herdr''s docs say agent wait observes state, not job completion. cbds and herdr-orch settle the same way. UPDATED 2026-10-25 (owner decision R): the worker''s result file (outbox/<task>-result.json, written as the brief''s preamble says) is the durable result. The Stop hook only signals that a turn ended; no last_assistant_message or transcript text is stored.'
        - id: q-wait-writes
          text: May wait write the ledger at all (orch F-1)?
          answer: Yes, but only under the ledger lock and only if the row is still open, so a stop always wins. wait never writes run state (owner, 2026-10-25).
      decisions_notes: |
        **Trigger:** the caller runs send, wait, result or questions. The worker's hooks (UserPromptSubmit starts a turn; Stop, PreToolUse on AskUserQuestion and PermissionRequest record events) write the evidence.
        **State:** mail files and events-*.ndjson in the run store. The turn id increments at each delivered message.
        **Inbox:** wipnote delegate inbox runs in the worker. It reads the worker's own mailbox (<root>/mail/<name>/), named by WIPNOTE_DELEGATE_RUN.
        **Answering:** slice 17 adds delegate answer.
        **Result (decision R, owner 2026-10-25):** send appends a preamble to each task, like orch (orch src/orch/service/transports.py:howto): write outbox/<task-id>-result.json by temp file plus rename. The Stop hook records only "turn ended"; no last_assistant_message or transcript text is stored.
        **Settle (D1):** a result file for the current task ends wait even when the hooks are silent. orch's send --wait missed that settle.
        **Settle (D1b, orch defect, Mac evidence 2026-10-25):** a result file in the outbox ends wait even while the state is stuck at working. When the session is stopped, wait ends at once with stopped, well before its timeout; it never blocks on a stopped session.
        **Question file (D7, orch defect, Mac evidence 2026-10-25):** a question the worker writes as outbox/<task-id>-q<n>.json counts as pending for status, questions, wait (returns asks) and the run view, even when hooks report nothing. Once answered, it is no longer listed. Slice 17's answer uses its id.
        **Result lookup (D3):** result returns the newest result file, whatever the state or watermark, and names the task it answers. orch returned null while a result file existed.
        **Suggestion (D8):** a grey suggestion left on the input line after the turn ends never keeps wait at working. Evidence: a result file was written and wait returned only about 28 minutes later, right after a stop.
        **Ready (D6):** wait NAME on a worker with no task returns ready as soon as slice 10's readiness predicate holds.
        **Do not copy (F-1):** orch's wait patched session state outside the session lock and could undo a stop. wait writes no run state. Its two ledger writes (adding a /clear session, the worker-loss close) run under the ledger lock and recheck that the row is still open. ANSWERED 2026-10-25 (owner): keep this design; a stop always wins. Two-sided test: stop, then a late wait write, leaves the row closed; the same write on an open row applies.
        **Payload:** wait prints {run, turn, outcome: ready|done|asks|idle_no_result|idle_shell|timeout|gone|stopped}. result prints the newest result file's body and its task id. questions prints JSON rows.
        **Polling:** at most 2 Hz, plus an fs watch where available. No daemon.
        **Claims (co-claim, answered 2026-10-25):** wait observes; a timeout changes no claim, and the orchestrator's episode is never touched. When the worker is gone, wait reuses slice 10's session-scoped expired close. When a bind event names a session not yet in worker_sessions (the worker ran /clear), wait enriches the ledger row, so the claim gate keeps treating that session as family.
        **Rejected:** settling on herdr idle (a lifecycle state, not a turn result). Parsing agent read output is rejected as racy. Storing the last assistant message from the Stop payload is rejected by the owner (decision R).
        **Refine:** match orch's send and wait semantics from slice 1.
        **Parallel:** no; it needs slice 10. It can run beside slices 12 and 13.
