      what: 'Add internal/delegate/herdr, a Go interface over the herdr CLI: tab create and close; pane split, run, get, close, rename, process-info, send-text and send-keys; agent prompt, read, get, list and rename. One-shot panes keep the mod''s tile layout; interactive workers share one workers tab per caller, split like orch (cap 6). A scripted fake drives the tests.'
