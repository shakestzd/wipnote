        - id: q-worker-layout
          text: Where does a worker's pane open?
          answer: 'ANSWERED 2026-10-25 (owner, corrected): exactly as orch. ONE workers tab per caller in the caller''s workspace; each new worker is a split inside that tab, cap 6 workers; the caller''s own tab is never split (orch src/orch/service/placement.py:place). An earlier note of a tab per worker is withdrawn.'
      decisions_notes: |
        **Trigger:** wipnote delegate spawn from a caller session or a human shell.
        **State:** ledger row (mode interactive), run folder with pane id, name and brief, events written by the worker's hooks. The caller is stored only as delegate_caller_session (the ledger's caller_session, passed in WIPNOTE_DELEGATE_CALLER). The worker's sessions.parent_session_id stays empty.
        **Spawn (decision F, ANSWERED 2026-10-25):** spawn returns within 3 s with status "starting". The bind and the brief happen inside the pane. delegate wait and list show readiness (starting, ready, gone).
        **Payload:** spawn prints {run, name, pane, harness, status}. tree prints a text tree, or JSON with --json.
        **Transport:** herdr pane run only. herdr agent start cannot run a custom command (https://herdr.dev/docs/agent-automation/). spawn waits until the new pane's shell has settled (orch src/orch/service/readiness.py:wait_shell_ready), then types one short quoted line with env prefixes inline (WIPNOTE_DELEGATE_RUN=... WIPNOTE_DELEGATE_CALLER=... wipnote delegate boot <run-id>). It never types blind.
        **Brief by file (finding 3):** the brief goes by FILE PATH in the run folder, never inline in the pane run string: macOS rejects input lines over its limit. delegate boot reads the file and passes it to the launcher as argv. The result preamble (decision R) is appended to the brief.
        **Rename and pin:** after the harness appears, the next wait or list renames the herdr agent to NAME (herdr agent rename) and pins pane id plus terminal_id, as orch adopts a late agent (orch src/orch/service/launch.py:adopt_late_agent). The 3 s return holds only because launch, bind and rename run in the pane or later, not in spawn.
        **Layout (decision L, ANSWERED 2026-10-25, corrected):** exactly as orch: one workers tab per caller in the caller's workspace; each new worker is a split inside it, cap 6 (orch src/orch/service/placement.py:place; split order in slice 6). The caller's own tab is never split. stop closes the worker's pane; the workers tab closes when its last worker stops.
        **Suggestion (D8, orch defect, Mac evidence 2026-10-25):** the harness draws a grey next-prompt suggestion on the input line after a turn ends. orch's wait asked herdr's agent status, never applied its own grey check (orch src/orch/service/readiness.py:typed_input is used only by the send and stop guards), and hung at working until a stop. Here the predicate never derives working from input-line text: working comes from hooks and the turn's own files. For the send and stop guards, a line whose every visible character is dim or grey (orch src/orch/service/inputstyle.py:is_suggestion) reads as empty; plain or mixed text, or a failed styled read, reads as a draft and blocks. The styled read is unverified on herdr until slice 2 checks it.
        **Readiness (D2):** one predicate in internal/delegate/session/ready.go serves wait, probe and send. States: starting, ready, working, question, idle_no_result (idle, no result written), idle_shell (idle, a background shell still running) and gone. orch's probe and send disagreed, and its state stuck at working on an idle pane.
        **Env scrub:** spawn removes inherited WIPNOTE_* session env from the pane command (WIPNOTE_PARENT_SESSION, WIPNOTE_PARENT_EVENT, WIPNOTE_NESTING_DEPTH). session_start.go reads them (lines 227-233 and isSubagent at 908-911); left in place they mark the worker as a subagent of the caller.
        **Names:** [a-z0-9-], 1 to 32 characters, unique among live runs in the project.
        **Stop (finding 2, orch src/orch/service/shutdown.py:stop):** first record the worker pids with their start times from herdr pane process-info. Then ask the agent to exit, and wait until process-info shows POSITIVELY the shell alone (missing details are unknown, not a shell). Only then close the pane, then check each recorded pid. process-info is gone once the pane closes, which is why pids come first. Never signal or kill.
        **Stop output (D5):** {pane_closed, tab_closed, survivors[]} stated plainly; pane_closed false always names why. orch once returned tab:false with surv:[] and no reason.
        **Launcher flags:** wipnote claude rejects --settings as its own flag; any Claude flag goes after `--` (Phase B evidence). Native workers need none (q-settings).
        **Container (decision C):** --container is added by slice 21; this slice keeps the place (host or container) in the run folder.
        **Ordering:** the SessionStart hook writes only a bind event. The next wait, list or stop moves bound sessions into worker_sessions (ledger Enrich). The worker's own claim does not wait for that, because the family gate's worker case matches on WIPNOTE_DELEGATE_RUN (slice 16).
