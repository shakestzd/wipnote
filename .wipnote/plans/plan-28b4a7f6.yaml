slices:
    - id: slic-0a1f3c11
      feature_id: feat-0031fd91
      num: 1
      title: Bring in the orch README and an inventory as reference
      what: Import orch's README (scrubbed) and write docs/design/orch-inventory.md from the owner's local source. The source stays outside the repo.
      why: orch is the reference for the port, and its source exists only on the owner's machine. Slices 5, 10 and 11 need its exact behaviour (mailbox layout, pinning, verified stop).
      files:
        - docs/reference/orch/README.md
        - docs/reference/orch/PROVENANCE.md
        - docs/design/orch-inventory.md
      deps: []
      done_when:
        - The inventory lists every orch subcommand and flag, each with a wipnote delegate target or 'not ported' and a reason
        - The inventory names the orch file and function for each behaviour slices 5, 10 and 11 copy (mailbox layout, pinning, verified stop)
        - PROVENANCE.md names orch 0.1.0, its file hashes and the herdr version; it states there is no git metadata and no license, and holds no code
        - wipnote check host-paths reports nothing in docs/reference/orch/ or docs/design/orch-inventory.md
      effort: S
      risk: Med
      tests: |
        Check: wipnote check host-paths over the new docs.
        Review: the owner confirms the inventory against orch --help output.
      complexity: standard
      approved: true
      comment: ""
      research_waiver: Internal source import. The owner supplies the material and no external standard applies.
      approval_status: approved
      execution_status: promoted
      decisions_notes: |
        **Trigger:** the owner reads the orch source on the local machine, or shares a read-only view of it.
        **State:** reference only (q-orch-source answered 2026-10-25: inventory-only). No orch code enters the repo. Nothing in docs/reference/orch/ is built, run or imported by Go code.
        **Payload:** a scrubbed README copy; PROVENANCE.md with the version string (orch 0.1.0) and SHA-256 hashes of the files read, because the archive has no git metadata and no commit can be named; docs/design/orch-inventory.md as the port checklist, with orch file and function names.
        **Rejected:** a git submodule, because it pulls a private remote into every clone. A source snapshot is rejected by the owner (license unknown). Porting from the README alone is also rejected: feat-ac66c687 found the README stale on mail roots.
        **Risk:** the README may hold host paths or user names, so scrub it before commit.
        **Parallel:** yes, with slices 2, 4 and 6.
        **License:** none found (no LICENSE file, no SPDX header; the Node packages say UNLICENSED). This confirms inventory-only.
        **Drafts (2026-10-25):** an inventory and a PROVENANCE.md were drafted outside the repo from the owner's archive. This slice copies them in when it runs; nothing is copied now.
        **Update on copy:** the drafts predate decisions R and C. The rows for send --no-result-file (now ported as the result preamble), spawn --container (now slice 21) and the ccx second-account gate (dropped) must be rewritten.
        **Event format:** the bundled orch hook binaries write event format v1 (with seq); the handoff text says v2. The inventory states both, for slice 18.
