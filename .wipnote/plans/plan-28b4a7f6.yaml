        Hook: TestDelegateBind_FastAndFailOpen.
        Claims: TestSpawn_WorkerClaimsItem, TestSpawn_RefusesWithoutWorkItem, TestStop_WorkerEpisodeAbandonedBySessionEnd, TestPaneLoss_ExpiresOnlyWorkerEpisode, TestOrchestratorEnd_WorkerKeepsClaim.
        Gate (cmd/wipnote/claim_ledger.go): TestLiveForeignClaims_WorkerIsFamilyOfCaller, TestLiveForeignClaims_CallerIsFamilyOfWorker, TestLiveForeignClaims_UnrelatedSessionStillRefused, TestLiveForeignClaims_EndedRowIsNotFamily, TestLiveForeignClaims_UnreadableDelegationLedgerFailsOpen, TestLiveForeignClaims_ClearedWorkerSessionIsFamily.
        Concurrency: TestSpawn_RefusesSecondLiveWorkerOnItem, TestSpawn_AllowsAfterWorkerPaneGone, TestSpawn_OneShotRunsDoNotCount.
        Live (HERDR_ENV=1 only): TestSpawn_LiveClaudeWorker.
      complexity: complex
      approved: false
      comment: ""
      research:
        - url: https://code.claude.com/docs/en/hooks
          claim: Every hook payload carries session_id; SubagentStart carries agent_id and agent_type.
          accessed: "2026-10-25"
        - url: https://herdr.dev/docs/agents/
          claim: herdr detects agent state from the screen or from integration reports.
          accessed: "2026-10-25"
        - url: https://github.com/ellingtonsp/herdr-orch
          claim: 'Prior art for verified release: close the pane, then prove no process survives (SIGTERM, then SIGKILL).'
          accessed: "2026-10-25"
      questions:
        - id: q-settings
          text: Does a native worker need orch's --settings hook file?
          answer: No. Workers start through wipnote claude or wipnote codex, whose plugin hooks fire, and the launcher passes no --settings (code search, 2026-10-25). The --settings risk applies only to orch during migration (Phase B check B1).
      decisions_notes: |
        **Trigger:** wipnote delegate spawn from a caller session or a human shell.
        **State:** ledger row (mode interactive), run folder with pane id and name, events written by the worker's hooks. The worker's sessions.parent_session_id is set to the caller from WIPNOTE_DELEGATE_CALLER.
        **Payload:** spawn prints {run, name, pane, harness}. tree prints a text tree, or JSON with --json.
        **Names:** [a-z0-9-], 1 to 32 characters, unique among live runs in the project.
        **Stop:** ask the agent to exit, wait, close the pane, then check herdr process-info. A worker that survives is reported, never silently killed outside the pane.
        **Rejected:** copying orch's --settings hook file (needless under wipnote's launchers). herdr agent start is rejected until it is known to accept a custom command.
        **Claim:** the worker's brief begins with wipnote <kind> start <id>, so the item lock, collision gate and claim ledger run unchanged; spawn polls .wipnote/claims/ for the episode. The worker stays a root session (no WIPNOTE_PARENT_SESSION), so it gets its own sessions-ledger row and claim shard. Stop relies on the worker's SessionEnd (abandoned); the caller never writes a live worker's shard. On a lost pane, after confirming no worker process remains, stop or list closes only that session's episodes as expired.
        **Family rule (q-claim-handoff answered: co-claim-gate):** extend liveForeignClaims in cmd/wipnote/claim_ledger.go (called by checkLiveCollisionGate from <kind> start, cmd/wipnote/workitem.go). An episode is family when (a) its session is in worker_sessions of an open interactive row whose caller_session is the caller, or (b) the caller's WIPNOTE_DELEGATE_RUN names an open row whose caller_session is the episode's session or root. An unreadable delegations ledger fails open. This is a cooperative gate, like --force: the env var is trusted only when it names an open row.
        **Ordering:** spawn waits for the SessionStart bind event, then writes the worker session into worker_sessions (ledger Enrich), and only then sends the brief that runs <kind> start. The hook stays a fast event write. After a /clear, the new session's bind event is added to worker_sessions by the next spawn, list or wait (slice 11).
        **One worker per item (q-concurrent-workers answered):** spawn refuses when an open interactive row for the item has a live pane. A row whose pane is gone is closed through the worker-loss path first. One-shot runs do not claim and do not count.
        **Rejected (claim):** opening the episode from the SessionStart hook, because that adds an item-lock and canonical write to a hook. A new suspended outcome is also rejected: the episode model has four outcomes, and the owner asked not to invent a new model.
        **Precondition:** bug-01f182e5 (claims reconcile treats live sessions as dead) must be fixed first; otherwise reconcile expires live workers' and orchestrators' episodes.
        **Refine:** check against orch's spawn, pinning and stop semantics from slice 1.
        **Parallel:** it can run beside slices 8, 9 and 12.
