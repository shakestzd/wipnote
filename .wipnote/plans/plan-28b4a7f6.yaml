            - name: events-<writer>.ndjson
              type: '{v, seq, ts, run, kind, sid, turn, agent_id}'
        - type: data-model
          title: Mailbox message
          fields:
            name: <root>/mail/<name>/{inbox,outbox}/<msg-id>.json; ack/<msg-id>
          rows:
            - name: id
              type: string msg-<12 hex>; a result is <task-id>-result
            - name: from
              type: caller session id or human
            - name: to
              type: run name
            - name: body
              type: string
            - name: turn
              type: int turn id the message starts
            - name: created
              type: RFC3339
            - name: hinted
              type: 'bool: herdr agent prompt succeeded'
            - name: type
              type: task | result | question | progress
            - name: seq
              type: int, rises per sender; one writer per folder
            - name: in_reply_to
              type: task id a result answers
