meta:
    id: plan-28b4a7f6
    track_id: trk-2e707ed1
    title: 'Native delegation in wipnote: port orch to Go and absorb codex-herdr-pane'
    description: 'Make orch''s delegation a native, Go-built wipnote feature (wipnote delegate: spawn, send, wait, result, stop, questions, tree, run) with a file mailbox, herdr panes for interactive sessions and one-shot runs on ONE path that absorbs mods/codex-herdr-pane. orch (Python, owner''s machine) is the reference. Replaces the mod-vs-orch split in docs/design/orch-integration.md.'
    created_at: "2026-10-25"
    status: finalized
    priority: medium
    schema_version: v4
    version: 42
design:
    problem: |
        ## Problem

        wipnote has two delegation paths. The `mods/codex-herdr-pane` mod (TypeScript, Claude Code mods engine) wraps one-shot `codex exec`, `codex review`, `ccx task` and `claude -p` calls in a herdr pane and writes a run folder (feat-a1df60c2). orch (Python, on the owner's machine only) drives interactive Claude and Codex sessions in herdr panes through a file mailbox. wipnote only reads orch's files (`internal/orchlink`, feat-ac66c687). `docs/design/orch-integration.md` line 16 splits the work: "the mod covers one-shot runs, orch covers interactive sessions". The owner replaced that split. Delegation becomes a native wipnote feature written in Go in the wipnote binary, with orch as the reference and the mod absorbed. The result is ONE path.

        Today a delegation leaves only hook events. No canonical record links it to a work item (feat-dd8b0cde). orch facts live outside the project and never reach `.wipnote/`.

        ## Non-goals

        - herdr-orch-style task DAGs, auto-dispatch, resource leases, PR CI watch, schedules and web UI. These are prior art, not scope.
        - Remote machines over SSH, and phone or chat front ends.
        - Parking an idle worker between tasks. Stop-when-done is the rule; slice 20 resumes a stopped worker instead (decision E).
        - Auto-accepting a worker's trust or permission prompts (brgr does this; we do not copy it by default).
        - Replacing Claude Code's native subagents (Task/Agent) or Codex's native subagents.
        - A dashboard or web view. The dashboard is gone; lineage and the CLI are the read surfaces.
        - Antigravity workers in v1 (q-antigravity answered no). The delegate skill is not shipped in the Antigravity tree.

        ## Design decisions (rationale in each slice's decisions_notes)

        1. **No daemon.** Every verb is a short CLI process, a bounded wait, or a process that lives in a herdr pane. Hooks write one small file and return. A missing or slow writer daemon never delays a hook or the launcher (user rule: daemons never block Claude).
        2. **Workers run under wipnote's launchers and claim the work item.** `spawn` starts `wipnote claude` or `wipnote codex` in the pane with `WIPNOTE_DELEGATE_RUN=<run-id>`. wipnote's own plugin hooks fire, so no `--settings` hook file is needed. The worker claims the item through the normal start path (owner, 2026-10-25; see Claims below). The launcher passes no `--settings` today (code search, 2026-10-25). The `--settings` risk remains only for orch during migration (Phase B check B1).
        3. **One writer per file.** Each mailbox message is its own file, written by temp file plus rename. Each process appends to its own events file. This avoids the APFS O_APPEND hazard (arch card daemon-purpose-outlives-sqlite) and any flock across a host-container bind mount.
        4. **One canonical record type (Q4) holding spawn and stop (Q3).** `.wipnote/delegations-ledger.html` has one row per run with `mode=oneshot|interactive`. Spawn opens the row. Exit or stop closes it. Usage and session ids enrich it. Tool and prompt events are not copied: they duplicate `agent_events`.
        5. **Settle on durable signals.** A wait ends on the worker's result file for the current task (decision R), an exit file, or the Stop hook's "turn ended" signal (reported as idle_no_result). herdr agent state is only a hint: herdr's docs say `agent wait` observes state, not job completion. cbds and herdr-orch settle the same way.
        6. **Keep the run-folder contract.** The files are raw.log, clean.log, clean.md, last.md, usage, exit, start, end, label, host and run.html, as in feat-a1df60c2. The report the caller sees keeps the mod's format, so prompts and viewers keep working.
        7. **Layout.** The engine lives in `internal/delegate/` (cmd imports internal). The ledger lives in `core/delegationledger/`, beside `core/sessionledger` and `core/gateledger`. herdr is driven through its CLI behind an interface, not the socket API: herdr-orch pins socket protocol 22, which changes between releases.

        ## Owner decisions 2026-10-25 (round 3)

        - **R. Result:** the worker writes outbox/<task>-result.json, as a preamble on the brief tells it. The Stop hook only signals "turn ended" (slices 5, 10, 11).
        - **S. Codex sandbox:** read-only by default, --write for workspace-write, danger-full-access only for an opted-in host (slice 12).
        - **C. Container:** ccx means container Claude. --container runs the worker in the project's own devcontainer; no second-account gate (slice 21).
        - **L. Layout (corrected 2026-10-25):** exactly as orch: ONE workers tab per caller in the caller's workspace; each new worker is a split inside it, cap 6 (slices 6, 10, 19).
        - **D. orch defects become two-sided regression tests:** D1 and D3 (slice 11), D2, D6 and D8 (slices 10, 11; D8 styled read checked in slice 2), D4 (slice 5), D5 (slice 10).
        - **E. Resume:** spawn NAME2 --resume NAME relaunches the recorded session (slice 20).

        ## The store

        | Data | Where | Committed | Why |
        |---|---|---|---|
        | Delegation-run row (spawn, stop, exit, usage, work item, caller and worker session ids) | `.wipnote/delegations-ledger.html` | yes, canonical | Survives cache purges; lineage reads it; reindex rebuilds the index from it |
        | Run folder, events, mailbox, pane ids | `.wipnote/delegate/`, gitignored like `sessions/` (q-live-store, owner 2026-10-25; the ignore entry ships in slice 5) | no | Ephemeral; reachable from the caller, the hooks and a container worker through the project bind mount |
        | Claim episodes of workers and the orchestrator | existing `.wipnote/claims/` shards (core/claimledger) | yes, canonical, unchanged format | Workers claim like any session; no new claim store |
        | Per-turn tool and prompt events | existing `agent_events` from wipnote hooks | as today | Not duplicated |

        No absolute host path, user name or home directory enters a ledger row or a work item. The ledger writer refuses such values. Run folders hold paths, but they are runtime files and never committed.

        ## Claims (q-worker-claim answered 2026-10-25: the worker claims the item)

        Workers use the existing claim-episode model in `core/claimledger` and `core/hooks/claim_episodes.go`. No claim store or outcome is added. Facts from the code (2026-10-25):

        - An episode is one row per (session, agent, work item), sharded by root session in `.wipnote/claims/`. Outcomes are `completed`, `released`, `abandoned` and `expired`. There is no `suspended`.
        - `wipnote <kind> start` opens an episode (idempotent per session). `checkLiveCollisionGate` refuses it while another live root session holds the item, unless `--force`. The caller's own family (same session, or same root) is not a collision.
        - A worker's episode is rooted at its own session, because `rootSessionFor(nil, ...)` falls back to the session id. So today the gate would refuse a worker while the orchestrator holds the item.
        - Completion by any session closes every open episode on the item (`CloseWorkItem`, written for the orchestrator hand-off case).
        - SessionEnd closes only that session's rows as `abandoned`. The stale-session reaper and `wipnote claims reconcile` close a dead session's rows as `expired`.

        Defined behaviour, which follows from that model whatever q-claim-handoff decides:

        - **How the worker claims.** Its brief begins with `wipnote <kind> start <id>`, so the item lock, the collision gate and the ledger write run unchanged. `spawn` returns before the worker claims, so `delegate wait` and `list` check that the episode appeared and report it if not. `spawn` needs a work item: `--work-item`, or else the caller's active claim. It refuses when neither exists.
        - **The worker stays a root session.** `spawn` does not set `WIPNOTE_PARENT_SESSION`, which would mark the worker as a subagent and drop its sessions-ledger row. The caller link travels in `WIPNOTE_DELEGATE_CALLER` and in the delegations ledger.
        - **Worker stop.** `delegate stop` asks the worker to exit. The worker's own SessionEnd closes its episode as `abandoned`. The delegations ledger records `end_reason=stop`, so lineage shows the stop was deliberate. The caller never writes the worker's shard while the worker lives.
        - **Worker crash or lost pane.** No SessionEnd fires. A `delegate` command in the caller (`wait`, `list` or `stop`) sees the pane gone and confirms that no worker process remains. It then closes only that worker session's episodes as `expired`, the same session-scoped close that `closeClaimEpisodesForSession` uses. `wipnote claims reconcile` stays the backstop. This depends on bug-01f182e5 (reconcile treats live sessions as dead) being fixed first, or reconcile would expire live workers.
        - **wait timeout.** It changes no claim. The worker keeps running and keeps its episode.
        - **Orchestrator ends first.** Its SessionEnd closes only its own rows. Workers keep their claims, and their delegation rows stay open until they end.
        - **Completion.** Whoever completes the item closes every open episode on it, worker and orchestrator alike (existing `CloseWorkItem`).

        **Handoff (q-claim-handoff answered 2026-10-25: co-claim, workers count as family).** The orchestrator keeps its episode while a worker holds its own, so the claim never leaves the orchestrator and nothing has to return. The claim gate (`liveForeignClaims` and `checkLiveCollisionGate` in `cmd/wipnote/claim_ledger.go`, called by `<kind> start` in `cmd/wipnote/workitem.go`) treats an episode as family in two cases:
        - It is held by a worker session listed in `worker_sessions` of an open interactive delegation row whose `caller_session` is the caller. This lets the orchestrator re-start or review.
        - The caller is a worker (`WIPNOTE_DELEGATE_RUN` names an open row) and the episode is held by that row's `caller_session` or its root. This lets the worker claim beside the orchestrator.

        An unreadable delegations ledger fails open, as an unreadable claim ledger does today. Completion has no claim gate, so the orchestrator can review and complete. Completion closes every open episode on the item, the worker's included (`CloseWorkItem`). The guidance therefore says to stop the worker before completing.

        **Concurrency (q-concurrent-workers answered 2026-10-25: one worker per item in v1).** `spawn` refuses when an open interactive row for the item has a live worker. A row whose pane is gone is closed first, through the worker-loss path. One-shot runs (`delegate run`) do not claim and do not count: q-worker-claim covers spawned workers.

        ## Prior art: herdr plugins (surveyed 2026-10-25)

        The directory at https://herdr.dev/plugins/ loads by JavaScript. It lists GitHub repos tagged `herdr-plugin` (1,907 repos). The survey read the top 100 by stars plus topic searches for orchestrat, delegat, mailbox, spawn, subagent, swarm, worker, dispatch, send task and inbox. It read READMEs only: no code was run and nothing was installed. All content was treated as reference data.

        | Plugin | Version / last update | License | spawn | send | wait | result | stop | questions | tree | Driven by | Use for wipnote |
        |---|---|---|---|---|---|---|---|---|---|---|---|
        | herdr built-in `agent` and `pane` commands (herdr 0.9.5) | 0.9.5 | herdr's own | `agent start`, `pane run` | `agent prompt` | `agent wait` (state only) | `agent read` (screen) | `pane close` | `blocked` state only | no | herdr CLI and socket API | **Use** as the transport in slice 6 |
        | [ellingtonsp/herdr-orch](https://github.com/ellingtonsp/herdr-orch) (`horch`) | v0.1.2, 2026-10-02; push 2026-10-14 | MIT | yes | yes, with receipts | `check --wait` | `horch done` plus herdr state | release with process-exit proof | `ask`/`reply`, decision gates | board only (runs, tasks, workers) | `herdr plugin install`; `horch` CLI; daemon started by the herdr server; SQLite per herdr session in herdr's plugin state dir | **Covers most of the scope.** Options: adopt, wrap or learn (q-adopt-vs-port) |
        | [zielus/herdr-woof](https://github.com/zielus/herdr-woof) | v1.1.0, 2026-10-04 | MIT | yes | yes | yes | dispatch settlement | protected release | yes | no | global `woofd` daemon, SQLite, `woof` CLI over a Unix socket | Learn from (its global daemon conflicts with decision 1) |
        | [mrrobot-ec/pod](https://github.com/mrrobot-ec/pod) | v0.2.10, 2026-10-16 | MIT | yes (Claude, Codex, Grok) | durable, acked | yes | report-proven | yes | gates | board | `herdr plugin install`, skills; **no daemon** | Learn from: its no-daemon model matches decision 1 |
        | [zqkra/cbds](https://github.com/zqkra/cbds) | no release; push 2026-08-31 | MIT | `dispatch start`, `spawn` | `say` | `wait` (fs watch, mandatory timeout) | fsynced report, task id plus dispatch id | partial | no | no | herdr plugin and CLI, Node, no dependencies | Learn from: stale-dispatch rejection and the mandatory timeout (slice 11) |
        | [husniadil/herdr-mail](https://github.com/husniadil/herdr-mail) and [herdr-dispatch](https://github.com/husniadil/herdr-dispatch) | v0.6.4 and v0.10.7, 2026-08-30/31 | MIT | dispatch | notify, ask, reply | partial | partial | dispatcher stop | ask/reply | **deliberately absent** ("who spawned whom") | Go binaries, `[[startup]]` daemon, skill symlink | Learn from: "the store is authoritative, the pane marker is a hint" (slice 5) |
        | [justn-hyeok/brgr](https://github.com/justn-hyeok/brgr) | v2.14.2, 2026-10-14 | MIT | yes | no | report notice | sealed report | closes the pane | no | no | Rust CLI | Learn from; do not copy its prompt auto-accept |
        | [junghan0611/entwurf](https://github.com/junghan0611/entwurf) | v0.41.2, 2026-10-24 | MIT | open/reopen | message | no | callback | retire | no | no | TS package, ACP plugin | Learn from: cross-harness identity (garden id), incl. Codex and Antigravity |
        | [GODVvVZzz/herdr-agent-chat](https://github.com/GODVvVZzz/herdr-agent-chat) | no release; 2026-09-23 | MIT | yes | yes | guardian delivery | files plus message | no | no | no | skill plus herdr plugin | Learn from |
        | [anhnd3005-infinity/herdr-worker-orchestrator](https://github.com/anhnd3005-infinity/herdr-worker-orchestrator) | no release; 2026-08-25 | MIT | yes (agy, codex) | yes | yes | diff review | no | no | no | Claude Code plugin plus herdr plugin | Learn from |
        | [jeffory/herdr-walkietalkie](https://github.com/jeffory/herdr-walkietalkie) | v0.5.1, 2026-08-12 | **none** | yes | files under `.wt/` | yes | files | no | no | no | shell `wt`; edits user agent config files | Cannot reuse (no license) |

        Narrower prior art: question inboxes (speardragon/herdr-ask-inbox, no license; LeaveMyYard/herdr-inbox, MIT) and sub-agent trees (blavka/agents-tree, MIT; LeaveMyYard/herdr-panorama, MIT).

        **Finding (answered 2026-10-25: port orch natively; herdr-orch stays prior art only).** herdr-orch covers spawn, send, wait, result, stop and questions, and gives a board instead of a sub-agent tree. That is most of the scope, so q-adopt-vs-port puts "adopt or wrap herdr-orch vs port orch" to the owner. Points against adopting it: it needs its own daemon and SQLite outside `.wipnote/`, so it has no work-item link or lineage. It is v0.1.x from one maintainer, with no stars. It covers neither one-shot `codex exec` runs nor the run-folder contract. Points for it: it is MIT and written in Go, and its settlement and verified-release logic is already built.

        ## Migration

        - **orch users (the owner).** orch keeps working until slices 10 and 11 reach parity. `internal/orchlink` keeps reading orch's registry until the import runs. The import is required: slice 18 (`wipnote delegate import-orch`) copies orch history into the ledger once (q-orch-import).
        - **codex-herdr-pane users.** The mod is removed by slice 14 in the same release that ships `delegate run` and the redirect (q-mod-removal). Its settings map to wipnote settings, with a one-time notice. Its run folders under the user cache age out through its own 7-day sweep. `wipnote delegate list` and `view` replace `/codex-runs`.
        - **The read-only orchlink.** It stays until slice 18's import has run. Then slice 13 deletes it and `cmd/wipnote/lineage_orch.go`.

        ## Notes

        - feat-ac66c687 is `in-progress` (10 of 11 steps), not done. Its open step is Q3/Q4, which this plan answers (decision 4).
        - The OpenUI twin views for this plan's slices are not written yet (follow-up).
    goals:
        - 'One native path: wipnote delegate spawn, send, wait, result, answer, stop, questions, tree, list, view, inbox, run, doctor and import-orch, written in Go in the wipnote binary.'
        - One-shot runs (codex exec/review, claude -p, ccx task) and interactive sessions share one run store, one herdr adapter and one canonical record. If spike spk-87139e0e shows parity, delegate run becomes spawn, send, wait and stop on an interactive worker, and the headless path is dropped.
        - A spawned worker claims its work item through the existing claim-episode model, and every worker claim ends with a recorded outcome.
        - Every delegation is a canonical row in .wipnote/delegations-ledger.html, linked to its work item and to its caller and worker sessions, and visible in wipnote lineage.
        - The orchestrator settles on durable signals (the worker's result file, exit files, the Stop hook's turn end) and never parses a pane's screen to decide that a worker finished.
        - mods/codex-herdr-pane and internal/orchlink are retired once the native path reaches parity.
    constraints:
        - No daemon dependency. No hook and no launcher waits on a daemon (user rule).
        - No absolute host paths, user names or company names in work items, ledger rows or this plan.
        - .wipnote/*.html is canonical. SQLite is a derived index. Runtime state is gitignored.
        - Generated plugin trees change only through wipnote plugin build-ports.
        - Code limits apply (file 500 lines, function 50 lines). Tests use a herdr stub; live herdr tests run only when HERDR_ENV=1.
        - Codex's sandbox is never disabled by default.
        - AGENTS.md, CLAUDE.md and GEMINI.md are owner-edited. Slices name needed changes as follow-ups.
