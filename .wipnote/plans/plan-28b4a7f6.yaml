      complexity: complex
      approved: false
      comment: ""
      research:
        - url: https://code.claude.com/docs/en/hooks
          claim: Claude Code PreToolUse updatedInput replaces the whole input, works with allow (auto-approve) or ask (show to the user).
          accessed: "2026-10-25"
        - url: https://learn.chatgpt.com/docs/hooks
          claim: Codex PreToolUse updatedInput is valid only with permissionDecision allow; Bash and exec_command match as Bash.
          accessed: "2026-10-25"
      questions:
        - id: q-rewrite-support
          text: Which harnesses can rewrite a Bash call in PreToolUse?
          answer: Both. Claude Code accepts updatedInput with allow or ask. Codex accepts updatedInput only with allow, which also auto-approves the call (docs read 2026-10-25).
      decisions_notes: |
        **Trigger:** PreToolUse on Bash, after the cheap tool-type match.
        **State:** none; a pure recogniser.
        **Payload:** one of three modes per q-intercept. deny-with-reason tells the model to run 'wipnote delegate run -- <same command>', so the retry passes normal permission checks. rewrite-ask (Claude only) shows the rewritten command. rewrite-allow (opt-in only) widens permission.
        **Risk High:** a rewrite with allow would auto-approve a codex exec the user never approved. On Codex, allow is the only rewrite mode.
        **Rejected:** a mod-side tool.call hook, because mods exist only in Claude Code. Rewriting chained commands is deferred (q-chained).
        **Parallel:** no; it needs slice 8. It can run beside slices 10 to 13.
