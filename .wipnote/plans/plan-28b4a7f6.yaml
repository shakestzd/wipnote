        - A message is readable with wipnote delegate inbox even when the prompt hint was lost
        - questions lists a pending AskUserQuestion with its options and drops it once the worker continues
        - wait, send, result and questions open or close no claim episode. On outcome gone, wait calls slice 10's worker-loss close. wait also adds a newly bound worker session (after /clear) to worker_sessions.
      effort: L
      risk: High
      tests: |
        Integration (fake herdr): TestSend_StoreFirstThenHint, TestWait_CurrentTurnOnly, TestWait_RequiresTimeout, TestResult_FromStopPayload, TestQuestions_PendingThenCleared.
        Hook: TestDelegateEvents_StopAndAskCaptured, TestDelegateEvents_FailOpen.
        Claims: TestWait_GoneExpiresOnlyWorker, TestWait_AddsClearedSessionToWorkerSessions, TestWait_TimeoutLeavesClaims.
      complexity: complex
      approved: false
      comment: ""
      research:
        - url: https://herdr.dev/docs/agents/
          claim: agent wait and agent prompt --wait observe state, not job completion.
          accessed: "2026-10-25"
        - url: https://github.com/zqkra/cbds
          claim: Reject a superseded dispatch (stale id) and require a timeout on every wait.
          accessed: "2026-10-25"
        - url: https://code.claude.com/docs/en/hooks
          claim: AskUserQuestion tool input carries questions and options; PermissionRequest carries tool_name and tool_input; SubagentStop carries last_assistant_message.
          accessed: "2026-10-25"
      questions:
        - id: q-settle
          text: What settles a wait?
          answer: A durable signal. That is the worker's Stop hook event for the current turn (with the last assistant message) or an explicit report. herdr's docs say agent wait observes state, not job completion. cbds and herdr-orch settle the same way.
      decisions_notes: |
        **Trigger:** the caller runs send, wait, result or questions. The worker's hooks (UserPromptSubmit starts a turn; Stop, PreToolUse on AskUserQuestion and PermissionRequest record events) write the evidence.
        **State:** mail files and events-*.ndjson in the run store. The turn id increments at each delivered message.
        **Payload:** wait prints {run, turn, outcome: done|question|timeout|gone}. result prints last.md for the turn. questions prints JSON rows.
        **Polling:** at most 2 Hz, plus an fs watch where available. No daemon.
        **Claims (co-claim, answered 2026-10-25):** wait observes; a timeout changes no claim, and the orchestrator's episode is never touched. When the worker is gone, wait reuses slice 10's session-scoped expired close. When a bind event names a session not yet in worker_sessions (the worker ran /clear), wait enriches the ledger row, so the claim gate keeps treating that session as family.
        **Rejected:** settling on herdr idle (a lifecycle state, not a turn result). Parsing agent read output is rejected as racy. Answering questions from the orchestrator is deferred (q-answer-questions).
        **Refine:** match orch's send and wait semantics from slice 1.
        **Parallel:** no; it needs slice 10. It can run beside slices 12 and 13.
      blocks:
        - type: diagram
          title: Send and wait
          fields:
            direction: tb
          entries:
            - send w1 'task' writes mail file (turn N)
            - herdr agent prompt hint
            - worker UserPromptSubmit logs turn N start
