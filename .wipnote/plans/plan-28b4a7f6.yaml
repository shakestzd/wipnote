              type: session id or empty
            - name: worker_sessions
              type: space-separated session ids
            - name: host
              type: host | container
            - name: started
              type: RFC3339
            - name: ended
              type: RFC3339 or empty
            - name: exit
              type: int or empty
            - name: end_reason
              type: exit | stop | pane_closed | gone
            - name: usage_input
              type: int tokens
            - name: usage_cached
              type: int tokens
            - name: usage_output
              type: int tokens
