            - name: Prompt(pane, text)
              type: herdr agent prompt
            - name: Read(pane, lines) -> string
              type: herdr agent read
            - name: State(pane) -> AgentState
              type: herdr agent get
            - name: TabCreate(workspace, label, cwd) -> (TabID, PaneID)
