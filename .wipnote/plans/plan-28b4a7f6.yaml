      execution_status: promoted
      questions:
        - id: q-append
          text: Do several processes ever append to one file?
          answer: No. Each writer owns its files (events-<writer>.ndjson, one file per message). The arch card daemon-purpose-outlives-sqlite records that O_APPEND is not atomic on APFS. flock across a host-container bind mount is unverified (Phase B check B7).
      decisions_notes: |
        **Trigger:** delegate run and spawn create a run directory. Hooks in a tagged worker write events. send writes messages.
        **State:** <root>/runs/<run-id>/ holds the run-folder files and events-*.ndjson. <root>/mail/<name>/ holds inbox/ (written by the caller), outbox/ (written by the worker) and ack/ (touched by the worker when it starts a task). <root> is .wipnote/delegate/ (q-live-store, owner 2026-10-25).
        **Payload:** see the data-model blocks. Files are written by temp file plus rename and fsynced before rename.
        **Gitignore:** this slice adds delegate/ to the managed block that core/worktree/gitignore.go writes, beside sessions/, events/ and logs/. EnsureWipnoteGitignore only creates a missing file (core/worktree/gitignore.go:10-19), so an existing project never gets the new line. Add an upgrader that appends each missing managed line to an existing file and never removes or reorders a user line.
        **Why the project root:** a container worker reaches it through the same bind mount as the code. A per-user cache differs between the Mac and the container.
        **Rejected:** one shared events.ndjson with flock, because of APFS O_APPEND and an unverified flock across the mount. SQLite for live state is rejected: it adds a writer and a lock to every hook.
        **Compared with orch (inventory section 3):** orch has inbox, outbox and ack folders and a per-sender seq checked under a per-mailbox lock (orch src/orch/stores/mailbox.py:_publish). The port keeps the three folders but drops the lock: each folder has one writer, so a sender's seq rises without a lock. orch issue J supports this: one shared events file with a 1 s flock lost 172 of 800 events on the bind mount.
        **Result file (decision R):** the worker writes outbox/<task-id>-result.json by temp file plus rename, as the brief's preamble tells it (orch src/orch/service/transports.py:howto).
        **Ids:** msg- and dlg- ids carry at least 12 hex characters (orch P-6 collisions with 8).
        **Sub-agents (D4):** orch counted plugin-hook and recap lines as sub-agents. Only SubagentStart and SubagentStop pairs whose agent_type comes from the Agent or Task tool count.
        **Redaction:** event summaries are redacted with Go's RE2 (linear). orch's backtracking regex took 4.9 s on 8000 characters (issue R).
        **Parallel:** yes, with slices 4 and 6 once slice 1 is done.
