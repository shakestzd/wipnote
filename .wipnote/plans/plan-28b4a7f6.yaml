slices:
    - id: slic-0a1f3c11
      num: 1
      title: Bring in the orch source and README as reference
      what: The owner shares the orch repo. Import its README and a pinned source snapshot, or an inventory only (q-orch-source), as read-only reference. Write an inventory that maps every orch command, flag, file and event to its wipnote delegate target. Scrub host paths and user names.
      why: orch is the reference for the port, and its source exists only on the owner's machine. Slices 5, 10 and 11 need its exact behaviour (mailbox layout, pinning, verified stop).
      files:
        - docs/reference/orch/README.md
        - docs/reference/orch/SOURCE.md
        - docs/design/orch-inventory.md
      deps: []
      done_when:
        - The inventory lists every orch subcommand and flag, each with a wipnote delegate target or 'not ported' and a reason
        - wipnote check host-paths reports nothing in docs/reference/orch/ or docs/design/orch-inventory.md
        - SOURCE.md names the orch commit, its license and what was scrubbed
      effort: S
      risk: Med
      tests: |
        Check: wipnote check host-paths over the new docs.
        Review: the owner confirms the inventory against orch --help output.
      complexity: standard
      approved: false
      comment: ""
      research_waiver: Internal source import. The owner supplies the material and no external standard applies.
      decisions_notes: |
        **Trigger:** the owner shares the repo (read access, a fork or an archive).
        **State:** reference only. Nothing in docs/reference/orch/ is built, run or imported by Go code.
        **Payload:** a README copy; SOURCE.md with commit, license and a scrub log; docs/design/orch-inventory.md as the port checklist.
        **Rejected:** a git submodule, because it pulls a private remote into every clone. Porting from the README alone is also rejected: feat-ac66c687 found the README stale on mail roots.
        **Risk:** the license is unknown and the source may hold host paths or user names, so scrub before commit.
        **Parallel:** yes, with slices 2, 4 and 6.
      blocks:
        - type: file-tree
          title: Files added
          entries:
            - docs/reference/orch/README.md
            - docs/reference/orch/SOURCE.md
            - docs/design/orch-inventory.md
    - id: slic-1b2e4d22
      num: 2
      title: 'Phase B: verify harness hooks on the owner''s Mac'
      what: Run a scripted check on the owner's Mac inside herdr, with its container half run here. It checks that --settings hooks add to plugin hooks, worker sids match wipnote sessions, Codex hooks fire (interactive and exec), container workers write the Mac's .wipnote/, and flock works across the bind mount.
      why: docs/design/orch-integration.md section 6 lists these as unverified. Slices 5, 10 and 12 depend on the answers, so this slice runs first.
      files:
        - scripts/delegate-phase-b.sh
        - docs/design/delegate-phase-b.md
      deps: []
      done_when:
        - docs/design/delegate-phase-b.md records each check as pass, fail or not run, with the command and the observed output
        - Each result is stored as an arch card (wipnote arch add) with repo-relative paths only
        - The script exits non-zero and names the check when herdr, claude, codex or wipnote is missing
      effort: S
      risk: Low
      tests: |
        Self-test in the container with HERDR_ENV unset: the script skips herdr checks and reports them as not run.
        Manual: the owner runs it on the Mac in a herdr pane and pastes the table into delegate-phase-b.md.
      complexity: standard
      approved: false
      comment: ""
      research:
        - url: https://code.claude.com/docs/en/hooks
          claim: Hook entries merge across settings levels; plugin hooks merge with user and project hooks. --settings is not listed as a hook location.
          accessed: "2026-10-25"
        - url: https://code.claude.com/docs/en/settings
          claim: --settings applies at the command-line level, above user and project files.
          accessed: "2026-10-25"
        - url: https://herdr.dev/docs/integrations/
          claim: herdr's Claude and Codex integrations add their own hook entries for session identity.
          accessed: "2026-10-25"
      decisions_notes: |
        **Trigger:** the owner runs scripts/delegate-phase-b.sh on the Mac in a herdr pane. The container half runs in this devcontainer.
        **State:** writes only to a temp dir and one scratch session; no project file changes.
        **Payload:** a pass/fail table plus one arch card per result.
        **Docs prior:** Claude Code docs say hook entries merge across settings levels and plugin hooks merge with user and project hooks. --settings is the command-line level, so the docs predict "add". The hooks page does not list --settings as a hook location, so the check stays.
        **Rejected:** deciding from docs alone, because CLAUDE.md records silent drift in every harness.
        **Parallel:** yes, with slices 1, 4 and 6.
      blocks:
        - type: tabs
          title: Phase B checks
          rows:
            - body: 'claude --settings <marker hook> started through wipnote claude: both the marker hook and the wipnote plugin hooks fire (a wipnote session row exists).'
              label: B1
            - body: 'An orch-spawned claude worker: the sid in orch events.ndjson equals the wipnote session id of that worker.'
              label: B2
            - body: herdr integration install claude/codex hooks coexist with wipnote plugin hooks; both report.
              label: B3
            - body: 'wipnote codex, interactive, in a pane: SessionStart fires and carries session_id.'
              label: B4
            - body: 'codex exec under the wipnote plugin: do any hooks fire (bug-3e4c6e02)?'
              label: B5
            - body: 'A container worker started with wipnote claude: its sessions-ledger row appears in the Mac checkout''s .wipnote/.'
              label: B6
