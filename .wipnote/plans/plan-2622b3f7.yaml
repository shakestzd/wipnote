        - cmd/wipnote/system_prompt_delegate_test.go
        - core/hooks/user_prompt.go
        - core/hooks/lifecycle_injection.go
        - core/hooks/canonical_guards_test.go
        - .claude/rules/code-hygiene.md
        - .claude/rules/debugging.md
        - .claude/rules/plugin-development.md
        - docs/design/guidance-audit.md (new)
        - port/pluginbuild/guidance_size_test.go
      deps:
        - 4
        - 6
      done_when:
        - The audit table lists every line of the system prompt and of each file in .claude/rules with its verdict and the tool that enforces it. CLAUDE.md lines are listed for slice 12
        - The Go gate command appears in one rule file
        - A second prompt with the same active item gets no ACTIVE line. The first prompt after a session start, resume, compact or clear gets it. A test covers each case
        - system-prompt.md is at most 3,500 bytes, down from 4,500, and its size limit is set to that
        - The slice 2 check shows the checked behaviours held
      effort: M
      risk: Med
      tests: |-
        core/hooks: TestUserPrompt_ActiveLineOnlyOnChange, _ResentAfterSessionStart, _ResentAfterCompact, _ResentAfterClear.
        core/hooks: canonical_guards_test.go:119 asserts the line on every prompt today and is rewritten.
        port/pluginbuild: the 3,500-byte limit for system-prompt.md passes.
      complexity: standard
      approved: true
      comment: ""
      research_waiver: Edits to wipnote's own prompt, rules and hook. The sources are cited in design.research.
      approval_status: approved
      decisions_notes: |-
        **Decisions:** the hook stores the last item it announced in a per-session marker. The SessionStart handler clears the marker for every start source (startup, resume, compact, clear), so the line is sent again after any event that can drop it from context. The implementer reuses the once-per-session helper in lifecycle_injection.go if it fits, and names it in the work item before coding.
        **B3:** the sentence cites the open-question records as its observed failure, as card A1 requires.
        **Scope:** CLAUDE.md is audited in the table and changed only in slice 12, by the owner.
        **Rejected:** dropping the ACTIVE line fully, because a session that lost its context needs it once.
      blocks:
        - type: tabs
          title: Verdicts for each line
          rows:
            - body: A hook, test or command already checks it. Drop the line, or keep one short pointer.
              label: Enforced
            - body: Nothing checks it. Keep it if a work item shows the failure. Otherwise drop it.
              label: Prose only
            - body: The same rule sits in more than one file. Keep one copy.
              label: Duplicate
    - id: ""
      num: 6
      title: Delegate guidance moves into the command
      what: Put the delegate steps into wipnote delegate --help and the hints that spawn prints. Add a delegate profiles command that prints the profile table from code, with a new read-only review profile. Delete the delegate skill and repoint the denial messages and tests that name it. Cards F5, D4. F5 replaces B2.
