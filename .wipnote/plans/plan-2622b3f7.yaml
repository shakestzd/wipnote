        cmd/wipnote: TestPlanCritique_ThirdRoundRefused.
        plan/planyaml: TestCritique_AcceptedRiskStaysSettled, TestCritique_CriticStatusRecorded, TestCritique_ContestedFindingNeedsCitation.
      complexity: standard
      approved: true
      comment: ""
      research:
        - url: https://github.com/google/elephant-goldfish-model
          claim: A fresh-context reviewer given only the artifact and a reading list gives an independent read. Rounds are capped and settled findings stay settled.
          accessed: "2026-11-18"
      adopt_vs_build:
        decision: build
        rejected:
            - 'keep the skill: it was never loaded while the command ran eight times'
      approval_status: approved
      decisions_notes: |-
        **Decisions:** the briefs are files in the plan's run folder, built from the plan YAML and the files it names. The command prints the two delegate spawn lines and starts no worker itself.
        **Schema:** three optional fields are added to the critique section in plan/planyaml/schema.go: round (int), accepted_risks (list of text plus reason), and status (completed or not_run) on each critic. They are optional, so schema_version stays v4.
        **Citation format:** path:line or an http(s) URL, checked in set-critique-yaml for a finding marked contested.
