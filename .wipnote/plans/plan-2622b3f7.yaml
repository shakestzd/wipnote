meta:
    id: plan-2622b3f7
    track_id: trk-0677c709
    title: Move agent guidance into CLI output and hooks
    description: 'The owner chose 30 of the 31 changes on the adoption board (spk-deb261d8). This plan carries them out: guidance moves from skills and always-loaded prompt text into CLI output, one worker-rules hook and tests. Retro skill E4 is deferred.'
    created_at: "2026-11-18"
    status: draft
    priority: medium
    schema_version: v4
    version: 3
design:
    problem: wipnote ships 11 skills (about 79 KB) and four slash commands. In 266 Claude Code transcripts for this project (1 to 18 November 2026) nobody typed a wipnote skill by hand except /wipnote:execute, twice. Agents ran the CLI 83 times for delegate and 34 times for plan authoring, and read the matching skills in two and three transcripts. Coder subagents get agent-context preloaded (117 spawns), and delegate workers (60 spawns) get no rules at all. So the guidance costs tokens where it loads and does not reach the agent where the work happens.
    goals:
        - Each rule an agent needs is printed by the command it already runs, or injected once by a hook when a worker starts.
        - The plugin ships no skill or slash command that the usage count showed nobody loads.
        - A test fails when a skill file or the system prompt passes a byte limit, so the cut holds.
        - Each prompt cut is checked with fixed tasks run against the old and the new text.
    constraints:
        - The owner alone edits CLAUDE.md, AGENTS.md and GEMINI.md. Slice 11 hands over a proposed text and does not write those files.
        - Generated trees under port/packages and plugin/hooks/hooks.json change only through wipnote plugin build-ports.
        - A skill is deleted only in the same slice that puts its useful lines into command output or help.
        - New guidance text names the work item where the failure was seen (card A1), or it is not added.
        - Codex and Antigravity get the same rules. A rule that only a Claude Code hook can deliver also appears in the command output.
        - Card E4 (retro skill) is out of scope until this plan is done.
    approved: false
    comment: ""
    research:
        - url: https://github.com/cursor/plugins/blob/main/pstack/skills/poteto-mode/SKILL.md
          claim: Guidance that a tool does not enforce should be short, earned by an observed failure, and checked by running the task before and after a change (cards A1, A2, A4, C2, C3).
          accessed: "2026-11-18"
        - url: https://github.com/mattpocock/skills
          claim: Skills stay small with linked reference files, test-first work goes one failing test at a time, and plans use vertical slices (cards A3, C1, D5).
          accessed: "2026-11-18"
        - url: https://github.com/google/elephant-goldfish-model
          claim: A reviewer with a fresh context and only the artifact finds what the author cannot. Rounds are capped and settled findings are not raised again (cards D1 to D4). The linked essay returned HTTP 403 and was not read.
          accessed: "2026-11-18"
        - url: https://addyosmani.com/topics/agentic-engineering/
          claim: Always-loaded context should hold pointers, completion needs evidence, and review should show weakened tests (cards A5, B1, B4, C2, E1, E2). The glossary, course and agent-skills repo were not read.
          accessed: "2026-11-18"
        - url: https://code.claude.com/docs/en/hooks
          claim: unverified in this session. The plugin manifest already registers SubagentStart, which slice 3 uses to inject the rules block. Slice 3 confirms the event's additional-context contract before coding.
          accessed: "2026-11-18"
slices:
    - id: ""
      num: 1
      title: Guardrails that keep guidance small
      what: Add a Go test that fails when a skill file or the system prompt passes a byte limit. Add a test that every skill is in the catalog, and an advisory list of skills with no eval case. Add the failure-bar rule to the plugin development rule file. Cards A1, A3, E3.
      why: Every later cut erodes without a limit. The limits start at the current sizes and each later slice lowers them.
      files:
        - port/pluginbuild/skill_catalog_test.go
        - port/pluginbuild/guidance_size_test.go (new)
        - .claude/rules/plugin-development.md
      deps: []
      done_when:
        - The size test fails when a skill or the system prompt grows past its recorded limit
        - The coverage test fails for a skill missing from the catalog
        - plugin-development.md states the failure bar in two lines
        - go build, go vet and go test pass
      effort: S
      risk: Low
      tests: |-
        port/pluginbuild: TestGuidanceSize_SkillOverLimitFails, with a temp skill one byte over its limit.
        port/pluginbuild: TestGuidanceSize_RealTreeWithinLimits, against plugin/skills and cmd/wipnote/prompts/system-prompt.md.
        port/pluginbuild: TestSkillCatalog_EverySkillListed. Check first whether skill_catalog_test.go already covers it.
      complexity: standard
      approved: false
      comment: ""
      research_waiver: A table-driven Go test over files in this repo. No external library or standard applies.
      adopt_vs_build:
        decision: build
        rejected:
            - 'external linter: the limit is a per-file byte table in this repo, about 40 lines of Go'
      decisions_notes: |-
        **Decisions:** limits are a per-file table in the test, set to today's sizes. A slice that shrinks a file lowers its limit in the same commit. The eval-coverage list only prints, because 13 eval cases exist and most skills are deleted later in this plan.
        **Rejected:** one global limit, because the delegate skill is twice the next largest and would set the bar for all.
      blocks:
        - type: file-tree
          title: Files
          entries:
            - port/pluginbuild/guidance_size_test.go (new)
            - port/pluginbuild/skill_catalog_test.go
            - .claude/rules/plugin-development.md
    - id: ""
      num: 2
      title: Before-and-after check for prompt changes
      what: Write three to five fixed tasks and a script that runs each with wipnote delegate run against the old and the new guidance text, then prints what the agent did side by side. Card A4.
      why: No prompt change in wipnote has proof that behaviour held. Slices 3 to 8 each cut or move guidance and need this check.
      files:
        - scripts/prompt-ab.sh (new)
        - plugin/evals/
        - docs/design/prompt-ab.md (new)
      deps: []
      done_when:
        - One command runs the fixed tasks on two git refs and writes a comparison file
        - The procedure page says what counts as a regression
        - A dry run on main against main reports no difference in the checked behaviours
      effort: M
      risk: Med
      tests: |-
        Run scripts/prompt-ab.sh main main and confirm the comparison reports the same checked behaviours for both.
        The checked behaviours are observable facts from the run ledger: work item started, failing test written first, gate run, commit names the item.
      complexity: standard
      approved: false
      comment: ""
      research_waiver: Uses wipnote delegate run and the existing plugin/evals cases. No external library applies.
      adopt_vs_build:
        decision: build
        rejected:
            - 'a general eval framework: plugin/evals already holds 13 cases and delegate run records each run'
      decisions_notes: |-
        **Decisions:** the check compares observable actions from the delegate run ledger, not the wording of replies. Tasks reuse plugin/evals cases where one fits.
        **Risk:** model runs vary. The page states that one differing run is a prompt to rerun, and two are a regression.
        **Rejected:** a judged score from a second model, because it adds cost and a second source of variance.
      blocks:
        - type: diagram
          title: Check flow
          entries:
            - Pick two git refs
            - Run each fixed task on both with delegate run
            - Read actions from the run ledger
            - Print the comparison
    - id: ""
      num: 3
      title: Worker-rules hook for subagents and delegate workers
      what: Inject one short rules block when a subagent or a delegate worker starts. It carries the sharper test-first rule, evidence at completion, the stuck rule, one rule for pre-existing errors, and the decision line. Remove the agent-context and code-quality-skill preloads and delete both skills. Cards F1, C1 to C5.
      why: Delegate workers got no rules in 60 spawns. One block serves both paths and replaces about 10 KB of preloaded skill text.
      files:
        - core/hooks/worker_rules.go (new)
        - cmd/wipnote/prompts/worker-rules.md (new)
        - cmd/wipnote/delegate_spawn.go
        - plugin/agents/patch-coder.md
        - plugin/agents/feature-coder.md
        - plugin/agents/architect-coder.md
        - plugin/agents/researcher.md
        - plugin/skills/agent-context/
        - plugin/skills/code-quality-skill/
        - .claude/rules/code-hygiene.md
      deps:
        - 1
        - 2
      done_when:
        - A coder subagent and a delegate worker both receive the same rules block at start, shown by a test for each path
        - The block is under 2 KB and the size test from slice 1 has a limit for it
        - code-hygiene.md and the block state the same rule for pre-existing errors
        - No file refers to the deleted skills
        - The slice 2 check shows the coder behaviours held
      effort: M
      risk: Med
      tests: |-
        core/hooks: TestSubagentStart_InjectsWorkerRules, for a wipnote coder agent type.
        cmd/wipnote: TestDelegateSpawn_BriefPreambleCarriesWorkerRules.
        port/pluginbuild: agents carry no skills preload after build-ports.
        Run the hook once and quote the real output in the work item.
      complexity: standard
      approved: false
      comment: ""
      research:
        - url: https://code.claude.com/docs/en/hooks
          claim: unverified. SubagentStart can add context for the subagent. Confirm the field and whether it applies to plugin agents before coding. If it does not, keep one small preloaded skill holding the same block.
          accessed: "2026-11-18"
      adopt_vs_build:
        decision: build
        rejected:
            - 'keep the two skills: they reach subagents only and never delegate workers'
      decisions_notes: |-
        **Decisions:** one markdown source for the block, embedded in the binary. The SubagentStart hook injects it for subagents. delegate spawn adds it to the brief preamble, which also covers Codex workers. The gate commands are not listed in the block, because wipnote check --gate already runs go build, go vet and go test.
        **Pre-existing errors (C4):** fix gate failures in files you changed, and start no unrelated refactor. code-hygiene.md changes to match.
        **Fallback:** if SubagentStart cannot add context, the block ships as one small preloaded skill and the delegate path stays as designed.
        **Rejected:** putting the rules in the main system prompt, because sessions that never implement would pay for them.
      blocks:
        - type: diagram
          title: How the rules reach a worker
          entries:
            - worker-rules.md embedded in the binary
            - SubagentStart hook adds it for a subagent
            - delegate spawn adds it to the brief preamble
            - Worker reads one block under 2 KB
    - id: ""
      num: 4
      title: Trim the system prompt and quiet the hooks
      what: Mark each line of the system prompt and the repo rules as enforced by a tool or prose only, then drop, soften or keep it. Add one sentence on asking only for decisions. Send the ACTIVE item line only when the active item changes. Cards A2, B3, B4.
      why: The ACTIVE line repeats on every prompt. After about 50 prompts it costs more than the whole system prompt.
      files:
        - cmd/wipnote/prompts/system-prompt.md
        - core/hooks/user_prompt.go
        - core/hooks/lifecycle_injection.go
        - .claude/rules/code-hygiene.md
        - .claude/rules/debugging.md
        - .claude/rules/plugin-development.md
        - docs/design/guidance-audit.md (new)
      deps:
        - 3
      done_when:
        - The audit table lists every line with its verdict and the tool that enforces it
        - The Go gate command appears in one rule file, not five
        - A second prompt with the same active item gets no ACTIVE line, shown by a test
        - The system prompt is no longer than today and its size limit is lowered
      effort: M
      risk: Med
      tests: |-
        core/hooks: TestUserPrompt_ActiveLineOnlyOnChange, two prompts with one item, then a third after the item changes.
        port/pluginbuild: the size limit for system-prompt.md is lowered and passes.
        Run the slice 2 check on the old and new prompt.
      complexity: standard
      approved: false
      comment: ""
      research_waiver: Edits to wipnote's own prompt, rules and hook. The sources are cited in design.research.
      decisions_notes: |-
        **Decisions:** the last ACTIVE item is kept per session in the session state the hook already writes. The B3 sentence cites the open-question records as its observed failure, as card A1 requires.
        **Scope:** CLAUDE.md is audited in the table and changed only in slice 11, by the owner.
        **Rejected:** dropping the ACTIVE line fully, because a resumed session needs it once.
      blocks:
        - type: tabs
          title: Verdicts for each line
          rows:
            - body: A hook, test or command already checks it. Drop the line, or keep one short pointer.
              label: Enforced
            - body: Nothing checks it. Keep it if a work item shows the failure. Otherwise drop it.
              label: Prose only
            - body: The same rule sits in more than one file. Keep one copy.
              label: Duplicate
    - id: ""
      num: 5
      title: Delegate guidance moves into the command
      what: Put the delegate steps into wipnote delegate --help and the hints that spawn prints. Add a delegate profiles command for the profile tables, with a read-only review profile. Replace the two delegate paragraphs in the system prompt with one pointer. Delete the delegate skill. Cards F5, B1, D4. F5 replaces B2.
      why: delegate ran 83 times and its 19.9 KB skill was read in two transcripts.
      files:
        - cmd/wipnote/delegate_spawn.go
        - cmd/wipnote/delegate_run.go
        - cmd/wipnote/delegate_profiles.go (new)
        - internal/delegate/oneshot/recipes.go
        - internal/delegate/oneshot/settings.go
        - cmd/wipnote/prompts/system-prompt.md
        - plugin/skills/delegate/
        - core/hooks/
      deps:
        - 1
        - 2
      done_when:
        - delegate --help gives the spawn, send, wait, result, stop sequence in under 40 lines
        - delegate profiles lists each profile with its model, effort and tools
        - A worker on the review profile cannot edit or write files, shown by a test on its settings
        - The system prompt holds one delegate pointer line
        - The denial messages that named the skill name the help instead
      effort: M
      risk: Med
      tests: |-
        cmd/wipnote: TestDelegateProfiles_ListsReview.
        internal/delegate/oneshot: TestReviewProfile_NoWriteTools.
        cmd/wipnote: TestDelegateHelp_Under40Lines.
        Search the tree for wipnote skill show delegate and confirm no result.
      complexity: standard
      approved: false
      comment: ""
      research_waiver: Moves wipnote's own guidance into its own command help. Profile settings follow the existing lean profile in internal/delegate/oneshot.
      adopt_vs_build:
        decision: build
        rejected:
            - 'keep the profile tables in a linked skill file (card B2): agents ran delegate 83 times and rarely opened the skill'
      decisions_notes: |-
        **Decisions:** spawn prints the next command to run (wait, then result, then stop) as a hint on stderr. The profile tables live in code and print from delegate profiles, so they cannot drift from the real settings. The review profile allows read and search tools and denies edit, write and shell writes.
        **Rejected:** card B2 (split the skill), replaced by F5 by the owner's choice of both.
      blocks:
        - type: diagram
          title: Where each part of the skill goes
          entries:
            - Steps to delegate --help
            - Next-step hints to spawn output
            - Profile tables to delegate profiles
            - Skill deleted
    - id: ""
      num: 6
      title: A plan next command replaces the plan skill
      what: Add wipnote plan next <id>. It prints the one next step for that plan and the rules for that step, including vertical slices and no plan for a change of one or two files. Move the reference files the command needs into its output. Delete the plan skill. Cards F2, D5.
      why: Plan commands ran in seven transcripts and the skill was read in three. The step rules reach the agent only if the command prints them.
      files:
        - cmd/wipnote/plan_next.go (new)
        - cmd/wipnote/plan_yaml_cmds.go
        - plugin/skills/plan/
        - plugin/commands/plan-review.md
      deps:
        - 1
        - 2
      done_when:
        - plan next names the right step for a draft, a validated, a critiqued, a reviewed and a promoted plan, each shown by a test
        - plan next with no id prints the triage rule and the create command
        - Each step's output is under 40 lines
        - No file refers to the deleted skill
      effort: M
      risk: Med
      tests: |-
        cmd/wipnote: TestPlanNext_Draft, _Validated, _NeedsCritique, _NeedsReview, _NeedsDecisions, _Promoted.
        cmd/wipnote: TestPlanNext_OutputUnder40Lines for each step.
        Author one small plan using only plan next and record the transcript in the work item.
      complexity: standard
      approved: false
      comment: ""
      research_waiver: The step logic reads wipnote's own plan YAML state. The slice rules come from the sources in design.research.
      adopt_vs_build:
        decision: build
        rejected:
            - 'keep the skill and shorten it: usage shows agents run the commands and skip the skill'
      decisions_notes: |-
        **Decisions:** the step is derived from plan state (validation result, critique present, slice approvals, promotions), so the command needs no stored cursor. SPEC, ENRICH, EXAMPLES and INTERVIEW_RENDERING content prints only for the step that needs it. Existing hints that end other plan commands point to plan next.
        **Rejected:** a wizard that runs the steps itself, because each step needs the agent's judgement or the owner's decision.
      blocks:
        - type: diagram
          title: Steps that plan next can name
          entries:
            - Draft
            - Validate
            - Critique
            - Review
            - Decisions
            - Promote
            - Spec
            - Close
    - id: ""
      num: 7
      title: Plan critique emits ready critic briefs
      what: Make wipnote plan critique <id> write a design brief and a feasibility brief. Each holds the plan id and a reading list, with no drafting history. Record each critic as completed or not run. Cap critique at two rounds and keep accepted risks settled. Delete the plan-critique skill. Cards F3, D1, D2, D3.
      why: The skill was never loaded while the command ran eight times. Today both critics may run in the author's context and share its blind spots.
      files:
        - cmd/wipnote/plan_critique.go
        - cmd/wipnote/plan_yaml_extras.go
        - plan/planyaml/
        - plugin/skills/plan-critique/
      deps:
        - 5
        - 6
      done_when:
        - plan critique writes two brief files and prints the delegate command for each, on the review profile
        - The design brief asks for a paraphrase first and the feasibility brief lists the three added checks
        - A third round is refused with a message that names the open findings
        - An accepted risk is stored and a later critique does not raise it again
        - The plan records each critic as completed or not run
      effort: M
      risk: Med
      tests: |-
        cmd/wipnote: TestPlanCritique_WritesTwoBriefs_NoDraftHistory.
        cmd/wipnote: TestPlanCritique_ThirdRoundRefused.
        plan/planyaml: TestCritique_AcceptedRiskStaysSettled, TestCritique_CriticStatusRecorded.
      complexity: standard
      approved: false
      comment: ""
      research:
        - url: https://github.com/google/elephant-goldfish-model
          claim: A fresh-context reviewer given only the artifact and a reading list gives an independent read. Rounds are capped and settled findings stay settled.
          accessed: "2026-11-18"
      decisions_notes: |-
        **Decisions:** the briefs are files under the plan's run folder, built from the plan YAML and the files it names. The command prints the two delegate spawn lines and does not start workers itself. Round count and accepted risks are fields in the plan YAML critique section. A contested finding must cite a file or doc line, which the write path checks.
        **Rejected:** critics as subagents of the author, because a subagent inherits the caller's framing in its brief.
      blocks:
        - type: diagram
          title: Critique flow
          entries:
            - plan critique writes two briefs
            - Two fresh reviewers read the plan and the listed files
            - Findings recorded with a file or doc line
            - Round two at most, accepted risks stay settled
    - id: ""
      num: 8
      title: Execute-preview does the dispatch maths
      what: 'Make execute-preview compute the ready set and the file overlap between ready tasks, and print a brief for each task. Its output states the review rule: block only on a failing run or a user-visible bug. Delete the execute skill and its mention of a cleanup command that does not exist. Cards F4, D6.'
      why: The skill tells the agent to intersect wipnote trace output by hand. It was loaded twice in 17 days.
      files:
        - cmd/wipnote/execute_preview.go
        - plugin/skills/execute/
      deps:
        - 3
        - 5
      done_when:
        - execute-preview lists the largest set of ready tasks with no shared file, shown by a test with overlapping slices
        - Each ready task has a brief with its item id, files, siblings and first command
        - The output names when code review is required and when it is skipped
        - No file refers to the deleted skill or to wipnote:cleanup
      effort: M
      risk: Med
      tests: |-
        cmd/wipnote: TestExecutePreview_ReadySetExcludesBlocked.
        cmd/wipnote: TestExecutePreview_OverlapDefersConflictingTask.
        cmd/wipnote: TestExecutePreview_BriefPerTask.
      complexity: standard
      approved: false
      comment: ""
      research_waiver: Graph and file-set logic over wipnote's own plan data. No external library applies.
      decisions_notes: |-
        **Decisions:** file sets come from each slice's files list, with wipnote trace as the fallback for a promoted feature that has commits. The overlap choice is greedy by slice number, which is stable and explainable. Briefs reuse wipnote context-pack. The existing JSON format keeps its fields and gains ready, deferred and briefs.
        **Rejected:** an exact maximum independent set, because plans have under 20 slices and a stable order matters more.
      blocks:
        - type: diagram
          title: What execute-preview computes
          entries:
            - Pending tasks with no open blocker
            - Remove tasks that share a file with an earlier ready task
            - Print one brief per ready task
            - List deferred tasks with the reason
    - id: ""
      num: 9
      title: Evidence in review and the gate
      what: Count removed tests and added skips in the diff, and list edits to guard, CI and lint config. Print them in wipnote review and wipnote check --gate as evidence, not as a failure. Open the review with the item's why, done-when, last gate result, linked commits and total added lines. Cards E1, E2.
      why: An agent can turn a gate green by deleting a test. No check in review or check shows this today.
      files:
        - cmd/wipnote/review.go
        - cmd/wipnote/check.go
        - core/gateledger/
      deps: []
      done_when:
        - A diff that deletes a test function shows a removed-tests count of one in both commands
        - A diff that adds t.Skip shows an added-skips count of one
        - An edit to a CI workflow or lint config is listed by path
        - wipnote review opens with the five header fields for an item that has them
        - Neither command changes its exit code because of these lines
      effort: M
      risk: Low
      tests: |-
        cmd/wipnote: TestWeakenedTests_CountsRemovedGoTest, _CountsAddedSkip, _ListsConfigEdits.
        cmd/wipnote: TestReview_EvidenceHeader.
        cmd/wipnote: TestCheckGate_EvidenceDoesNotFail.
      complexity: standard
      approved: false
      comment: ""
      research:
        - url: https://addyosmani.com/topics/agentic-engineering/
          claim: Review should surface weakened tests and the evidence for a change before the diff itself.
          accessed: "2026-11-18"
      decisions_notes: |-
        **Decisions:** detection reads the unified diff. It covers Go test functions and t.Skip, JavaScript and TypeScript test and it calls with skip, and Python test functions with a skip marker. Other languages print nothing. The header reads fields the store already holds.
        **Rejected:** failing the gate on a removed test, because a correct refactor removes tests too.
      blocks:
        - type: data-model
          fields:
            name: Evidence block
          rows:
            - name: removed_tests
              type: int
            - name: added_skips
              type: int
            - name: config_edits
              type: list of paths
            - name: added_lines
              type: int
    - id: ""
      num: 10
      title: Remove the unused skills and slash commands
      what: Move the useful lines of guard-authoring, ui-stills-verification and report-issue into each command's help. Delete those three skills, the skills index, the Simplified Technical English skill and the recommend slash command. Fold the ci, init and plan-review slash commands into the CLI commands they wrap. Cards F6, F7.
      why: None was loaded by hand in 266 transcripts. The STE lookup works only on the owner's machine.
      files:
        - plugin/skills/guard-authoring/
        - plugin/skills/ui-stills-verification/
        - plugin/skills/report-issue/
        - plugin/skills/skills/
        - plugin/skills/simplified-technical-english/
        - plugin/commands/
        - cmd/wipnote/
        - mods/
      deps:
        - 3
        - 5
        - 6
        - 7
        - 8
      done_when:
        - plugin/skills holds no skill that this plan lists for deletion
        - guard, ui stills and issue help each carry the lines an agent needs, under 40 lines each
        - No hook message, prompt, agent file, mod or doc refers to a deleted skill or command
        - build-ports output matches the source tree for all three targets
        - The feat-4151d2f0 prose check is merged before the STE skill is deleted
      effort: M
      risk: Med
      tests: |-
        port/pluginbuild: the catalog and size tests pass with the smaller tree.
        Search every tracked file for each deleted skill and command name and confirm no result outside the changelog.
        Start one session on each of Claude Code and Codex and confirm the plugin loads with no missing-file error.
      complexity: standard
      approved: false
      comment: ""
      research_waiver: Deletes wipnote's own unused files. The usage count in design.problem is the evidence.
      decisions_notes: |-
        **Decisions:** this slice runs last among the skill slices, so one search confirms no reference remains. The mods that open panes for ci and plan-review stay, and their docs name the CLI command. If a deleted skill still holds a file another tool reads, that file moves beside the command.
        **Depends on:** feat-4151d2f0 gives the CLI replacement for the STE lint.
        **Rejected:** keeping the skills index, because wipnote help --compact lists the commands.
      blocks:
        - type: tabs
          title: What happens to each
          rows:
            - body: guard-authoring, ui-stills-verification, report-issue, and the ci, init and plan-review commands.
              label: Fold into help
            - body: The skills index, the Simplified Technical English skill and the recommend command.
              label: Delete
    - id: ""
      num: 11
      title: Shrink this repo's CLAUDE.md to pointers
      what: Move the deploy, launch, Codespaces, plugin-source and upstream-monitoring sections of CLAUDE.md into path-scoped rule files and docs. Hand the owner a proposed CLAUDE.md of about 40 lines as a diff. The owner applies it. Card A5.
      why: All 221 lines load in every session in this repo.
      files:
        - .claude/rules/
        - docs/
        - CLAUDE.md
      deps:
        - 4
      done_when:
        - Each moved section exists in a rule file or doc, and a path-scoped rule loads only for its paths
        - The proposed CLAUDE.md is about 40 lines and every pointer in it resolves
        - The owner has applied or rejected the diff. No agent wrote CLAUDE.md
      effort: M
      risk: Low
