    - id: ""
      num: 8
      title: Plan critique emits ready critic briefs
      what: Make wipnote plan critique <id> write a design brief and a feasibility brief. Each holds the plan id and a reading list, with no drafting history. Record each critic as completed or not run. Cap critique at two rounds and keep accepted risks settled. Delete the plan-critique skill. Cards F3, D1, D2, D3.
      why: The skill was never loaded while the command ran eight times. Today both critics may run in the author's context and share its blind spots.
      files:
