    - id: ""
      num: 5
      title: Trim the system prompt and quiet the hooks
      what: Mark each system prompt and repo rule line as enforced or prose only, then drop, soften or keep it. Replace the two delegate paragraphs with one pointer. Add one sentence on asking only for decisions. Send the ACTIVE line only on an item change or a session start. Cards A2, B1, B3, B4.
      why: The ACTIVE line repeats on every prompt. After about 50 prompts it costs more than the whole system prompt.
      files:
