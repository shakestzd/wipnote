      complexity: standard
      approved: true
      comment: ""
      research:
        - url: https://code.claude.com/docs/en/hooks
          claim: SubagentStart returns hookSpecificOutput.additionalContext, added before the subagent's first prompt. core/hooks/harness_response.go:29 already maps it. subagent_start.go:17 returns Continue only today.
