meta:
    id: plan-2622b3f7
    track_id: trk-0677c709
    title: Move agent guidance into CLI output and hooks
    description: 'The owner chose 30 of the 31 changes on the adoption board (spk-deb261d8). This plan carries them out: guidance moves from skills and always-loaded prompt text into CLI output, one worker-rules hook and tests. Retro skill E4 is deferred.'
    created_at: "2026-11-18"
    status: draft
    priority: medium
    schema_version: v4
    version: 23
design:
    problem: wipnote ships 11 skills (about 79 KB) and four slash commands. In 266 Claude Code transcripts for this project (1 to 18 November 2026) nobody typed a wipnote skill by hand except /wipnote:execute, twice. Agents ran the CLI 83 times for delegate and 34 times for plan authoring, and read the matching skills in two and three transcripts. Coder subagents get agent-context preloaded (117 spawns), and delegate workers (60 spawns) get no rules at all. So the guidance costs tokens where it loads and does not reach the agent where the work happens.
    goals:
        - Each rule an agent needs is printed by the command it already runs, or injected once by a hook when a worker starts.
        - The plugin ships no skill or slash command that the usage count showed nobody loads.
        - A test fails when a skill file or the system prompt passes a byte limit, so the cut holds.
        - Each prompt cut is checked with fixed tasks run against the old and the new text.
    constraints:
        - The owner alone edits CLAUDE.md, AGENTS.md and GEMINI.md. Slice 11 hands over a proposed text and does not write those files.
        - Generated trees under port/packages and plugin/hooks/hooks.json change only through wipnote plugin build-ports.
        - A skill is deleted only in the same slice that puts its useful lines into command output or help.
        - New guidance text names the work item where the failure was seen (card A1), or it is not added.
        - Codex and Antigravity get the same rules. A rule that only a Claude Code hook can deliver also appears in the command output.
        - Card E4 (retro skill) is out of scope until this plan is done.
        - feat-4151d2f0 (prose check) merges before slice 11 deletes the Simplified Technical English skill.
        - Each slice that deletes a skill also removes its eval cases, its catalog row and every reference to it, except in CLAUDE.md, which slice 12 handles.
    approved: false
    comment: ""
    research:
        - url: https://github.com/cursor/plugins/blob/main/pstack/skills/poteto-mode/SKILL.md
          claim: Guidance that a tool does not enforce should be short, earned by an observed failure, and checked by running the task before and after a change (cards A1, A2, A4, C2, C3).
          accessed: "2026-11-18"
        - url: https://github.com/mattpocock/skills
          claim: Skills stay small with linked reference files, test-first work goes one failing test at a time, and plans use vertical slices (cards A3, C1, D5).
          accessed: "2026-11-18"
        - url: https://github.com/google/elephant-goldfish-model
          claim: A reviewer with a fresh context and only the artifact finds what the author cannot. Rounds are capped and settled findings are not raised again (cards D1 to D4). The linked essay returned HTTP 403 and was not read.
          accessed: "2026-11-18"
        - url: https://addyosmani.com/topics/agentic-engineering/
          claim: Always-loaded context should hold pointers, completion needs evidence, and review should show weakened tests (cards A5, B1, B4, C2, E1, E2). The glossary, course and agent-skills repo were not read.
          accessed: "2026-11-18"
        - url: https://code.claude.com/docs/en/hooks
          claim: A SubagentStart hook can return hookSpecificOutput.additionalContext, which is added to the subagent's context before its first prompt. The matcher accepts plugin-scoped agent names. Verified by the feasibility critic on 2026-11-18.
          accessed: "2026-11-18"
        - url: https://code.claude.com/docs/en/memory
          claim: A rule file under .claude/rules can be scoped with a paths frontmatter field. Verified by the feasibility critic; .claude/rules/debugging.md already uses it.
          accessed: "2026-11-18"
slices:
    - id: ""
      feature_id: feat-9fd0cb31
      num: 1
      title: Guardrails that keep guidance small
      what: Add a Go test that fails when a skill file or a prompt under cmd/wipnote/prompts passes a byte limit. Make the catalog test also fail on a row for a skill that no longer exists. Print the skills with no eval case. Add the failure-bar rule to the plugin development rule file. Cards A1, A3, E3.
      why: Every later cut erodes without a limit. The limits start at the current sizes and each later slice lowers them.
      files:
        - port/pluginbuild/skill_catalog_test.go
        - port/pluginbuild/guidance_size_test.go (new)
        - .claude/rules/plugin-development.md
      deps: []
      done_when:
        - The size test fails when a skill or a prompt grows past its recorded limit
        - The catalog test fails for a stale row as well as for a missing one
        - plugin-development.md states the failure bar in two lines
        - go build, go vet and go test pass
      effort: S
      risk: Low
      tests: |-
        port/pluginbuild: TestGuidanceSize_SkillOverLimitFails, with a temp skill one byte over its limit.
        port/pluginbuild: TestGuidanceSize_RealTreeWithinLimits, against plugin/skills and every file in cmd/wipnote/prompts.
        port/pluginbuild: TestSkillCatalog_NoStaleRows. TestSkillCatalogListsEverySkill (skill_catalog_test.go:74) already covers the missing-row case.
      complexity: standard
      approved: true
      comment: ""
      research_waiver: A table-driven Go test over files in this repo. No external library or standard applies.
      adopt_vs_build:
        decision: build
        rejected:
            - 'external linter: the limit is a per-file byte table in this repo, about 40 lines of Go'
      approval_status: approved
      execution_status: done
      decisions_notes: |-
        **Decisions:** limits are a per-file table in the test, set to today's sizes. A slice that shrinks a file lowers its limit in the same commit. The eval-coverage list only prints, because 13 eval cases exist and most skills are deleted later in this plan.
        **Rejected:** one global limit, because the delegate skill is twice the next largest and would set the bar for all.
      blocks:
        - type: file-tree
          title: Files
          entries:
            - port/pluginbuild/guidance_size_test.go (new)
            - port/pluginbuild/skill_catalog_test.go
            - .claude/rules/plugin-development.md
    - id: ""
      feature_id: feat-217fb5f2
      num: 2
      title: Before-and-after check for prompt changes
      what: Write three to five fixed tasks and a script that runs each with wipnote delegate run against the old and the new guidance text, then prints what the agent did side by side. Card A4.
      why: No prompt change in wipnote has proof that behaviour held. Slices 3 to 8 each cut or move guidance and need this check.
      files:
        - scripts/prompt-ab.sh (new)
        - plugin/evals/
        - docs/design/prompt-ab.md (new)
      deps: []
      done_when:
        - One command builds the binary for each of two git refs in its own worktree, runs each fixed task three times per ref, and writes a comparison file
        - A planted regression (the test-first rule removed from the guidance) is flagged by the check
        - 'The procedure page states the pass rule: a behaviour that holds in three of three runs on the old ref and in fewer than two on the new ref is a regression'
      effort: M
      risk: Med
      tests: |-
        Run scripts/prompt-ab.sh with a ref that removes the test-first rule and confirm the check flags it.
        Run it on main against main and confirm no behaviour is flagged under the pass rule.
        The checked behaviours are facts from the run ledger: work item started, failing test written first, gate run, commit names the item.
      complexity: standard
      approved: true
      comment: ""
      research_waiver: Uses wipnote delegate run and the existing plugin/evals cases. No external library applies.
      adopt_vs_build:
        decision: build
        rejected:
            - 'a general eval framework: plugin/evals already holds 13 cases and delegate run records each run'
      approval_status: approved
      execution_status: done
      decisions_notes: |-
        **Decisions:** prompts are embedded in the binary (cmd/wipnote/claude.go), so the script builds one binary per ref in a git worktree. Each task runs three times per ref. The check compares observable actions from the delegate run ledger, not the wording of replies. Tasks reuse plugin/evals cases where one fits.
        **Pass rule:** a behaviour that holds in three of three runs on the old ref and in fewer than two on the new ref is a regression.
        **Rejected:** a judged score from a second model, because it adds cost and a second source of variance.
      blocks:
        - type: diagram
          title: Check flow
          entries:
            - Pick two git refs
            - Run each fixed task on both with delegate run
            - Read actions from the run ledger
            - Print the comparison
    - id: ""
      feature_id: feat-0d9b57bc
      num: 3
      title: Worker-rules block for delegate workers and other harnesses
      what: Write one rules block of at most 3 KB and embed it in the binary. Add it to the brief preamble of every delegate worker. Make the Codex and Antigravity agent builds append this block where they append the preloaded skills today. Cards F1 (first half), C1 to C5.
      why: Delegate workers got no rules in 60 spawns. The block must exist and reach every harness before the skills it replaces can go.
      files:
        - cmd/wipnote/prompts/worker-rules.md (new)
        - cmd/wipnote/delegate_spawn.go
        - port/pluginbuild/codex_agents.go
        - port/pluginbuild/preload_skills_test.go
        - port/pluginbuild/codex_agents_test.go
        - port/pluginbuild/guidance_size_test.go
        - plugin/agents/researcher.md
      deps:
        - 1
        - 2
      done_when:
        - A delegate worker's brief preamble carries the block, shown by a test
        - Codex and Antigravity agent files built by build-ports carry the block and not the two skills
        - The block is at most 3 KB and the size test has a limit for it
        - 'Every section of agent-context and code-quality-skill has a recorded disposition: in the block, printed by a named command, or dropped with a reason'
      effort: M
      risk: Med
      tests: |-
        cmd/wipnote: TestDelegateSpawn_BriefPreambleCarriesWorkerRules.
        port/pluginbuild: TestCodexAgents_CarryWorkerRules and the same for Antigravity.
        port/pluginbuild: the size limit for worker-rules.md passes.
      complexity: standard
      approved: true
      comment: ""
      research_waiver: wipnote's own brief preamble and agent builder. The rule wording comes from the sources in design.research.
      adopt_vs_build:
        decision: build
        rejected:
            - 'keep the two skills: they reach subagents only and never delegate workers'
      approval_status: approved
      execution_status: promoted
      decisions_notes: |-
        **Disposition of agent-context (6.8 KB):** work attribution and completion, the six-step workflow with C1 and C2, safety, and principles go in the block, shortened. Research routing stays in the researcher agent file. Persist-then-summarize goes in the block as one line. Writing style becomes one line that names wipnote prose check (feat-4151d2f0).
        **Disposition of code-quality-skill (3.2 KB):** the per-language gate commands are dropped from prose, because wipnote check --gate detects the language and runs them. The Go suite note (use scripts/go-test-streaming.sh) is repo-specific and stays in CLAUDE.md. Size and design review is printed by check --gate. Record-the-result is one line in the block.
        **New lines (cards C1 to C5):** one failing test per acceptance criterion, expected values from the spec; a command and its output for each done-when line; after a second failed fix, test what both fixes assumed; fix gate failures in files you changed and start no unrelated refactor; one decision line for a choice that is hard to reverse.
        **Pre-existing errors (C4):** the owner chose this rule on the board. Slice 4 changes code-hygiene.md to match.
        **Rejected:** putting the rules in the main system prompt, because sessions that never implement would pay for them.
      blocks:
        - type: tabs
          title: Where each skill section goes
          rows:
            - body: Attribution and completion, the workflow with the sharper test-first and evidence rules, safety, the stuck rule, the pre-existing errors rule, the decision line, one writing line.
              label: In the block
            - body: 'Gate commands and size review: wipnote check --gate. Prose rules: wipnote prose check.'
              label: Printed by a command
            - body: Research routing in the researcher agent. The Go test-streaming note in CLAUDE.md.
              label: Stays elsewhere
    - id: ""
      num: 4
      title: SubagentStart delivers the block, and the two preloaded skills go
